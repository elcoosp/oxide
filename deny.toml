# cargo-deny configuration (readiness P1: license + advisory gate).
# Run in CI via EmbarkStudios/cargo-deny-action (see .github/workflows/ci.yml).

[licenses]
version = 2
# The workspace itself is MIT OR Apache-2.0. Allow the OSI-approved licenses
# that appear in the dependency tree (wasmtime/cranelift pull Apache-2.0 WITH
# the LLVM exception; image codecs pull BSD/Zlib/IJG-style licenses).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
]
# High-confidence exceptions: crates whose license detection is noisy but
# whose upstream licensing is unambiguous.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
