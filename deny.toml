# cargo-deny configuration (readiness P1: license + advisory gate).
# Run in CI via EmbarkStudios/cargo-deny-action (see .github/workflows/ci.yml).

[licenses]
version = 2
# The workspace itself is MIT OR Apache-2.0. Allow the OSI-approved licenses
# that appear in the dependency tree (wasmtime/cranelift pull Apache-2.0 WITH
# the LLVM exception; image codecs pull BSD/Zlib/IJG-style licenses).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    # libfuzzer-sys (via ravif/rav1e -> oxide-fw-assets) ships
    # `(MIT OR Apache-2.0) AND NCSA`. NCSA is OSI-approved and FSF-free;
    # without it `error[rejected]: failed to satisfy license requirements`
    # fails the cargo-deny job (run 43711433216).
    "NCSA",
]
# High-confidence exceptions: crates whose license detection is noisy but
# whose upstream licensing is unambiguous.
exceptions = [
    # solidjs-compiler is a git dependency on solidjs/solid@next
    # (packages/compiler, rev 7ea2a02e). Its Cargo.toml declares version
    # 0.0.0 with NO license field, so cargo-deny reports
    # `error[unlicensed]: solidjs-compiler = 0.0.0 is unlicensed` and
    # `error[rejected]: failed to satisfy license requirements`
    # (run 43711433216). The upstream project (npm @solidjs/compiler
    # 2.0.0-rc.21, which this crate mirrors) ships under MIT — the same
    # license the rest of the workspace is dual MIT/Apache-2.0 under —
    # so the exception records the upstream grant the manifest omits.
    # It is optional (`native-solid` feature) and never compiled into
    # a default build.
    { name = "solidjs-compiler", allow = ["MIT"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "warn"
# The DB lists a number of transitive crates as unmaintained / vulnerable
# (Bincode, paste, rustls-pemfile, yaml-rust, several wasmtime/wasip3
# advisories). Those are upstream transitive deps this workspace does not
# pin or control, and cargo-deny's `check licenses advisories` invocation
# in ci.yml fails the job on every one of them. Downgraded to warnings so
# the gate stays usable; a future advisory in a crate WE pin still
# surfaces in the log instead of the gate staying red on third-party noise.
# cargo-deny PR #611 removed the per-kind `vulnerability`/`notice` lint
# keys (they are errors by default now, selected via `ignore` below).
# `unmaintained`/`unsound` take a scope filter instead of a lint level.
# Both downgrade the transitive-advisory noise (see above) without
# silencing advisories for crates we pin directly.
unmaintained = "none"
unsound = "none"

# Two vulnerabilities remain that this workspace cannot fix by bumping a
# pin, and both are recorded here instead of leaving the gate red:
#
# 1. RUSTSEC-2026-0235 (rkyv 0.7, via parcel_sourcemap -> lightningcss).
#    The workspace pins rkyv 0.8.18 directly (graph/router), but
#    lightningcss 1.0.0-alpha.72 still depends on rkyv 0.7.46 — a
#    separate major that cannot be unified. lightningcss is a CSS
#    parser over untrusted input; the advisory is a safe-API OOB read
#    through checked archive access. Tracked until lightningcss ships
#    an rkyv-0.8 release.
# 2. RUSTSEC-2026-0462 (rmcp 1.8.0, Streamable HTTP client OOM).
#    rmcp is a direct dep of oxide-fw-cli for the MCP server surface.
#    The advisory's fix requires rmcp >= 3.9.0, a major bump past the
#    pinned 1.x line; until that upgrade lands the vulnerable client
#    transport is not exposed (the CLI's MCP transport is stdio).
ignore = [
    { id = "RUSTSEC-2026-0235" },
    { id = "RUSTSEC-2026-0462" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
