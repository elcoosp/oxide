[package]
description = "Typed configuration model, static extractor and environment loader for oxide.config.{ts,js,mjs}."
keywords = ["configuration", "config", "typescript", "web-framework", "schema"]
categories = ["config", "web-programming"]
authors.workspace = true
name = "oxide-fw-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oxide-fw-adapters = { workspace = true }
oxide-fw-diagnostics = { workspace = true }
# V2-F19: the typed permission policy (`PermissionSet`, `PermissionDefault`,
# `host_allowed`) lives in the V8-free half of `oxide-fw-jshost` (`perm.rs`);
# the config layer deserializes into it directly so there is one grant shape,
# not two. `default-features = false` keeps config V8-free (no deno_core).
oxide-fw-jshost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# V2-F04: this crate now carries a pedantic-lint surface (the experiments
# config section), so it adopts the workspace lints policy like
# `oxide-fw-dispatch` / `oxide-fw-router` / `oxide-fw-schema` before it.
[lints]
workspace = true
