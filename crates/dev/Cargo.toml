[package]
description = "Development server support for Oxide: file watching, the HMR generation counter and the plugin registry."
keywords = ["dev-server", "hmr", "file-watcher", "hot-reload", "web-framework"]
categories = ["development-tools", "web-programming"]
authors.workspace = true
name = "oxide-fw-dev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oxide-fw-diagnostics = { workspace = true }
notify = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Content-hash confirmation for the watcher (§5.5, D6) — workspace-pinned, no new dep.
blake3 = { workspace = true }
local-ip-address = { workspace = true }
qrcode = { workspace = true }
rcgen = { workspace = true }
# V2-E01: `hmr_boundary` spans on the planner (§V2-E01) — workspace-pinned,
# no new dep.
tracing = { workspace = true }
# V2-E12: the workspace-links seam resolves linked packages to their REAL
# trees (symlink-resolving defaults, the spec's `preserveSymlinks: false`)
# — the pinned workspace version the bundler/jshost resolvers already use.
oxc_resolver = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# V2-E01: criterion harness for the boundary-planner bench (the B09 pattern:
# plain `cargo test` never pays the criterion build).
criterion = { workspace = true }

[features]
# V2-E01: exposes the criterion bench harness for the boundary planner, the
# same opt-in the A02/A05/A06/B09/F03/F05/F18 benches use.
bench-util = []

# V2-E01: criterion bench for the HMR boundary planner (deep chains, wide
# fan-outs, the reload fallback).
[[bench]]
name = "boundary"
harness = false
required-features = ["bench-util"]

# V2-E01 phase 3: criterion bench for the §13.3 message-schema v1 wire —
# the frame encode/decode the fan-out and the endpoint run per publish
# (batch shapes 1/16/64 plus the two non-entry controls).
[[bench]]
name = "hmr_wire"
harness = false
required-features = ["bench-util"]

# V2-E01 phase 4: criterion bench for the state-preservation seam — the
# `update_frame` verdict stamp the fan-out runs per publish (boundary
# batches 1/16/64, the full-reload clear path, the verdict's own serde).
[[bench]]
name = "state"
harness = false
required-features = ["bench-util"]

# V2-E12: criterion bench for the workspace-links seam — the discovery pass
# the dev boot runs once (glob expansion over the workspace + the resolver
# work per linked dependency) and the real-path probe the graph harvest
# runs per node.
[[bench]]
name = "workspace"
harness = false
required-features = ["bench-util"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
