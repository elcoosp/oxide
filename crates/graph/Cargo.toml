[package]
description = "The Oxide demand graph and incremental build engine: content-addressed nodes and per-route reuse."
keywords = ["incremental-build", "build-graph", "caching", "content-addressed", "web-framework"]
categories = ["development-tools::build-utils", "caching"]
authors.workspace = true
name = "oxide-fw-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
object_store = { workspace = true, optional = true }
rkyv = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
oxide-fw-diagnostics = { workspace = true }
blake3 = { workspace = true }
zstd = { workspace = true }
redb = { workspace = true }
rayon = { workspace = true }
dashmap = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }

[features]
default = []
s3 = ["dep:object_store"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# V2-A02 closing leg (M1): this crate now inherits the workspace lint policy
# (`[workspace.lints.rust] warnings = "deny"` + `[workspace.lints.clippy]
# pedantic = warn, priority = -1`). The 52 pre-existing pedantic findings are
# cleared (the `Ord for Input` restructure to tag-first + OR-pattern merges
# collapsed the `match_same_arms` cluster; `DemandGraph::get` now takes
# `&NodeKey`; `invalidate`'s seeds walk extracted into `collect_seeds`; the
# `missing_errors_doc`/`missing_panics_doc`/`must_use_candidate`/cast/map
# findings fixed across cas/demand/lib/trackers + the test suite) with zero
# `#[allow]` and no behavior change (tests green). The drift guard
# (`crates/diagnostics/tests/lint_uniformity.rs` + `scripts/check-lint-uniformity.sh`)
# fails if this table re-diverges.
[lints]
workspace = true
