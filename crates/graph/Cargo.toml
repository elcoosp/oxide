[package]
description = "The Oxide demand graph and incremental build engine: content-addressed nodes and per-route reuse."
keywords = ["incremental-build", "build-graph", "caching", "content-addressed", "web-framework"]
categories = ["development-tools::build-utils", "caching"]
authors.workspace = true
name = "oxide-fw-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
object_store = { workspace = true, optional = true }
rkyv = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
oxide-fw-diagnostics = { workspace = true }
blake3 = { workspace = true }
zstd = { workspace = true }
redb = { workspace = true }
rayon = { workspace = true }
dashmap = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }

[features]
default = []
s3 = ["dep:object_store"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
