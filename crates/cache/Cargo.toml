[package]
description = "Three-tier caching for Oxide (memory, disk, remote) with tag invalidation and Redis, S3 and HTTP handlers."
keywords = ["cache", "redis", "s3", "tiered-cache", "http-cache"]
categories = ["caching", "web-programming"]
authors.workspace = true
name = "oxide-fw-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
redis = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
async-trait = { workspace = true }
oxide-fw-diagnostics = { workspace = true }
blake3 = { workspace = true }
base64 = { workspace = true }
redb = { workspace = true }
zstd = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
moka = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
ring = { workspace = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# V2-B09: benchmark harness for key construction, tag insert and disk writes.
criterion = { workspace = true }
# The `observer` example renders the seam's rows through a real subscriber
# (the walkthrough's whole point); the bench installs a silent one so the
# measured cost is the event dispatch, not the rendering.
tracing-subscriber = { workspace = true }

# V2-B09: criterion harness (opt-in via the bench-util feature so plain
# `cargo test` never pays the criterion build).
[[bench]]
name = "keys"
harness = false
required-features = ["bench-util"]

# V2-A04: criterion bench for the canonical `build_id_of_dist` walk+hash.
[[bench]]
name = "build_id"
harness = false
required-features = ["bench-util"]

# The observer seam's hot-path cost (§20): the delta an attached observer
# puts on the memory-hit path against the no-observer default.
[[bench]]
name = "observer"
harness = false
required-features = ["bench-util"]

# The metrics exporter's two costs (§20): the per-event counter adds on the
# attached hot path, and the scrape render's stability across the counter
# state.
[[bench]]
name = "metrics"
harness = false
required-features = ["bench-util"]

# The event feed's two sides (§20): the bounded push the cache's call path
# pays (roomy vs saturated) and the drain arms the host's task runs.
[[bench]]
name = "feed"
harness = false
required-features = ["bench-util"]

# The posture pull's two costs (§20): the snapshot walk over the tier
# state (memory-only vs the full stack) and the gauge render's stability
# across the posture state.
[[bench]]
name = "health"
harness = false
required-features = ["bench-util"]

# The observer fanout's composition cost (§20): the per-event fan delta
# across one/two/three children and the composed hot path a three-child
# dashboard boot pays on a fresh L0 hit.
[[bench]]
name = "fanout"
harness = false
required-features = ["bench-util"]

# The hot-key attribution's bounded-ledger cost (§20): the per-event
# attribution delta (resident / admits / refuses) and the top-window
# read the dashboard's sample call pays.
[[bench]]
name = "hot_keys"
harness = false
required-features = ["bench-util"]

# F51: the eviction story's cost (§20): the steady-state S-08 prune a
# zero-budget write pays per set (victim pick + delete + the counter
# adds + observer delivery, with and without an exporter attached) and
# the pull reads' share (`stats()` / `health()` sampling the total).
[[bench]]
name = "eviction"
harness = false
required-features = ["bench-util"]

# F53: the HTTP service's per-exchange cost (§20): the pure core's
# route + codec/MAC round per exchange (GET hit, PUT, GET miss) over a
# real in-memory backing store.
[[bench]]
name = "cache_plane"
harness = false
required-features = ["bench-util"]

# F54: the §11.3 serving half's cost (§20): the ONE serve call's three
# shapes — the 304 arm, the full arm with a conditional miss, and the
# no-conditional floor.
[[bench]]
name = "serve"
harness = false
required-features = ["bench-util"]

# F58: the health arm's cost (§20): the per-pull cost `GET /health` pays
# (one CacheHealth snapshot + serde) against the unconfigured 404 floor.
[[bench]]
name = "plane_health"
harness = false
required-features = ["bench-util"]

# F60: the client's deadline arm — the happy path's wrapper overhead
# (the bounded exchange vs the pre-F60 unbounded client) against a real
# plane service on a local socket.
[[bench]]
name = "handler_deadline"
harness = false
required-features = ["bench-util"]

# F61: the plane's metrics arm — the full scrape cost (both §20 halves:
# the counter pull + render, the gauge pull + render) against the
# unconfigured 404 floor and the render-only shape a host's own scrape
# rides.
[[bench]]
name = "plane_metrics"
harness = false
required-features = ["bench-util"]

# F63: the client's peer-posture probes — the wired node's posture
# question over the wire (the health pull's exchange + JSON decode, the
# metrics pull's exchange + text read) against a real plane service on a
# local socket, beside the refused-dial degrade floor.
[[bench]]
name = "peer_probe"
harness = false
required-features = ["bench-util"]

# F64: the shell's exchange bounds — the legit PUT under the default cap
# (the bound's cost: one comparison), the over-cap 413 refusal floor
# (before the first body byte lands) and the unbounded drain's codec 400
# the escape hatch restores.
[[bench]]
name = "exchange_bounds"
harness = false
required-features = ["bench-util"]

# F65: the client's read bound — the legit read under a generous cap (the
# bound's cost: one length comparison per chunk), the over-cap answer's
# refusal floor (the exchange stops at the cap, the bytes past it never
# land) and the pre-F65 unbounded drain of the same answer (the memory
# the cap buys down, measured).
[[bench]]
name = "client_read_limit"
harness = false
required-features = ["bench-util"]

# F66: the client's request-line trust boundary — the guard's per-name
# scan (the pass arm over a canonical route key, the refuse arm stopping
# at the offending byte) beside the full guarded `set` exchange, where
# the scan rides the verb's real cost.
[[bench]]
name = "client_name_guard"
harness = false
required-features = ["bench-util"]

# F67: the shell's concurrency bound — the bound's whole happy-path price
# (one permit acquire before the spawn, one release at task end) against
# the pre-F67 uncapped shell over the same GET.
[[bench]]
name = "conn_cap"
harness = false
required-features = ["bench-util"]

# F68: the client's inflight bound — the bound's whole happy-path price
# (one permit acquire before the socket opens, one release at
# completion) against the pre-F68 unbounded client over the same GET.
[[bench]]
name = "client_inflight"
harness = false
required-features = ["bench-util"]

# F69: the sharded multi-plane client — the routing hop's price (the
# composite's routed GET vs a direct client's GET against the same
# plane) and the tag fan-out's price (N exchanges, by design) beside the
# single-plane list.
[[bench]]
name = "sharded_client"
harness = false
required-features = ["bench-util"]

# F70: the client's keep-alive reuse — the dial tax the pool removes
# (the pooled client's GET vs the pre-F70 close client's GET against the
# same honored shell; the delta IS the TCP handshake).
[[bench]]
name = "client_keepalive"
harness = false
required-features = ["bench-util"]

[features]
redis = ["dep:redis"]
s3 = ["dep:object_store", "dep:futures"]
# V2-B09: exposes the bench fixtures helper (`bench targets' opt-in gate`).
bench-util = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# V2-A02: this crate does not inherit the workspace lints yet (the recorded
# dedicated hygiene pass adopts pedantic) — declared so the newer cargo
# `missing_lints_inheritance` notice stays silent about the intent.
[lints]
