[package]
description = "Three-tier caching for Oxide (memory, disk, remote) with tag invalidation and Redis, S3 and HTTP handlers."
keywords = ["cache", "redis", "s3", "tiered-cache", "http-cache"]
categories = ["caching", "web-programming"]
authors.workspace = true
name = "oxide-fw-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
redis = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
async-trait = { workspace = true }
oxide-fw-diagnostics = { workspace = true }
oxide-fw-odf = { workspace = true }
blake3 = { workspace = true }
base64 = { workspace = true }
redb = { workspace = true }
zstd = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
moka = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ring = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# V2-B09: benchmark harness for key construction, tag insert and disk writes.
criterion = { workspace = true }

# V2-B09: criterion harness (opt-in via the bench-util feature so plain
# `cargo test` never pays the criterion build).
[[bench]]
name = "keys"
harness = false
required-features = ["bench-util"]

[features]
redis = ["dep:redis"]
s3 = ["dep:object_store"]
# V2-B09: exposes the bench fixtures helper (`benches support module`).
bench-util = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
