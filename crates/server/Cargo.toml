[package]
name = "oxide-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Hyper pipeline, static assets, compression, TLS, rules (spec 12, 17, D7, D13)"

[dependencies]
async-trait = { workspace = true }
oxide-diagnostics = { workspace = true }
oxide-cache = { workspace = true }
oxide-router = { workspace = true }
oxide-render = { workspace = true }
oxide-config = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
oxide-odf = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["server-auto", "server-graceful", "client", "client-legacy", "http1", "http2", "tokio"] }
socket2 = { version = "0.5", features = ["all"] }
http-body-util = { workspace = true }
tokio = { workspace = true }
# P-15: bridge the blocking (de)compressor thread back into a BodyStream.
tokio-stream = "0.1"
tokio-rustls = { workspace = true }
# §12.1: HTTP/3 (QUIC transport + HTTP/3 framing). Feature-gated at the call
# site by `server.http3`; the deps are always compiled so the surface is real.
quinn = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
rustls-pemfile = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
flate2 = { workspace = true }
brotli = { workspace = true }
zstd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
ring = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# P-12: hot-asset body cache (no blocking re-read per request).
moka = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
