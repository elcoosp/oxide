[package]
description = "The Oxide HTTP pipeline: hyper transport, middleware chain, loaders, streaming render and metrics."
keywords = ["http-server", "middleware", "streaming", "hyper", "web-framework"]
categories = ["web-programming::http-server", "network-programming"]
authors.workspace = true
name = "oxide-fw-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait = { workspace = true }
oxide-fw-diagnostics = { workspace = true }
oxide-fw-cache = { workspace = true }
oxide-fw-router = { workspace = true }
oxide-fw-render = { workspace = true }
oxide-fw-config = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
oxide-fw-odf = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["server-auto", "server-graceful", "client", "client-legacy", "http1", "http2", "tokio"] }
socket2 = { version = "0.6.5", features = ["all"] }
http-body-util = { workspace = true }
tokio = { workspace = true }
# P-15: bridge the blocking (de)compressor thread back into a BodyStream.
tokio-stream = "0.1"
tokio-rustls = { workspace = true }
# §12.1: HTTP/3 (QUIC transport + HTTP/3 framing). Feature-gated at the call
# site by `server.http3`; the deps are always compiled so the surface is real.
quinn = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
rustls-pemfile = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
flate2 = { workspace = true }
brotli = { workspace = true }
zstd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
ring = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# P-12: hot-asset body cache (no blocking re-read per request).
moka = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
