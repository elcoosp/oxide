[package]
description = "The Oxide HTTP pipeline: hyper transport, middleware chain, loaders, streaming render and metrics."
keywords = ["http-server", "middleware", "streaming", "hyper", "web-framework"]
categories = ["web-programming::http-server", "network-programming"]
authors.workspace = true
name = "oxide-fw-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
oxide-fw-diagnostics = { workspace = true }
oxide-fw-cache = { workspace = true }
oxide-fw-router = { workspace = true }
oxide-fw-render = { workspace = true }
oxide-fw-config = { workspace = true }
# V2-F09: the built-in search engine — optional so the default build
# stays lean (the spec's `search` feature, default off in dev builds).
oxide-fw-search = { workspace = true, optional = true }
url = { workspace = true }
base64 = { workspace = true }
oxide-fw-odf = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["server-auto", "server-graceful", "client", "client-legacy", "http1", "http2", "tokio"] }
socket2 = { version = "0.6.5", features = ["all"] }
http-body-util = { workspace = true }
tokio = { workspace = true }
# P-15: bridge the blocking (de)compressor thread back into a BodyStream.
tokio-stream = "0.1"
tokio-rustls = { workspace = true }
# §12.1: HTTP/3 (QUIC transport + HTTP/3 framing). Feature-gated at the call
# site by `server.http3`; the deps are always compiled so the surface is real.
quinn = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
rustls-pemfile = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
flate2 = { workspace = true }
# PERF-22 (readiness): sharded rate-limit buckets (no global mutex).
dashmap = { workspace = true }
brotli = { workspace = true }
zstd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
ring = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# P-12: hot-asset body cache (no blocking re-read per request).
moka = { workspace = true }

[features]
# V2-F05: exposes the criterion bench harness (the V2-B09 pattern — plain
# `cargo test` never pays the criterion build).
bench-util = []

# V2-F09: the built-in search endpoint (`/_oxide/search`). Pulls the
# tantivy engine; the CLI enables this for projects with
# `search.collections` configured. Default off — the endpoint answers the
# documented not-configured 404 without it.
search = ["dep:oxide-fw-search"]

# V2-F13: criterion bench for the nav-graph substrate (observe / top /
# decay / persist), behind the `bench-util` opt-in like every other
# criterion bench in the workspace.
[[bench]]
name = "navgraph"
harness = false
required-features = ["bench-util"]

[dev-dependencies]
tempfile = { workspace = true }
# V2-F05: the runner/stream pins run under tokio's paused clock
# (`start_paused` + `advance`) so debounce and keepalive cadence are
# deterministic; `test-util` is test-only and never reaches production.
tokio = { workspace = true, features = ["test-util"] }
# V2-B09/V2-F05: criterion for the live-hub and framing benches.
criterion = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "live"
harness = false
required-features = ["bench-util"]

[[bench]]
name = "stream"
harness = false
required-features = ["bench-util"]

# V2-F12: criterion bench for the brownout governor (level transitions and
# the one-atomic-load request-path cost).
[[bench]]
name = "governor"
harness = false
required-features = ["bench-util"]

# V2-A07: criterion bench for the prerender error-status sidecars — the
# serve-start scan (one-time, O(dist)) and the per-request `status_for` probe.
[[bench]]
name = "status_sidecars"
harness = false
required-features = ["bench-util"]
