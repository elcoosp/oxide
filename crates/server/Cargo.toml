[package]
description = "The Oxide HTTP pipeline: hyper transport, middleware chain, loaders, streaming render and metrics."
keywords = ["http-server", "middleware", "streaming", "hyper", "web-framework"]
categories = ["web-programming::http-server", "network-programming"]
authors.workspace = true
name = "oxide-fw-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
oxide-fw-diagnostics = { workspace = true }
oxide-fw-router = { workspace = true }
oxide-fw-render = { workspace = true }
oxide-fw-config = { workspace = true }
# V2-F56: the static plane's conditional decision rides the cache crate's
# canonical comparison (`conditional_response`, RFC 9110 §13) — the seam
# the F54 serving half's doc names the asset server as the second
# evidence of duplicating.
oxide-fw-cache = { workspace = true }
# V2-F09: the built-in search engine — optional so the default build
# stays lean (the spec's `search` feature, default off in dev builds).
oxide-fw-search = { workspace = true, optional = true }
url = { workspace = true }
base64 = { workspace = true }
oxide-fw-odf = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["server-auto", "server-graceful", "client", "client-legacy", "http1", "http2", "tokio"] }
socket2 = { version = "0.6.5", features = ["all"] }
http-body-util = { workspace = true }
tokio = { workspace = true }
# P-15: bridge the blocking (de)compressor thread back into a BodyStream.
tokio-stream = "0.1"
tokio-rustls = { workspace = true }
# §12.1: HTTP/3 (QUIC transport + HTTP/3 framing). Feature-gated at the call
# site by `server.http3`; the deps are always compiled so the surface is real.
quinn = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
rustls-pemfile = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
flate2 = { workspace = true }
# PERF-22 (readiness): sharded rate-limit buckets (no global mutex).
dashmap = { workspace = true }
brotli = { workspace = true }
zstd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
ring = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# P-12: hot-asset body cache (no blocking re-read per request).
moka = { workspace = true }
# V2-F24: the log feed's capture arm (`CaptureLayer`) is a
# `tracing_subscriber::Layer` — a second read on the event stream the
# host's subscriber installs. The dev-dep copy the F22 test pins ride
# is promoted to a regular dep; the render half the CLI installs is
# unchanged.
tracing-subscriber = { workspace = true }

[features]
# V2-F05: exposes the criterion bench harness (the V2-B09 pattern — plain
# `cargo test` never pays the criterion build).
bench-util = []

# V2-F09: the built-in search endpoint (`/_oxide/search`). Pulls the
# tantivy engine; the CLI enables this for projects with
# `search.collections` configured. Default off — the endpoint answers the
# documented not-configured 404 without it.
search = ["dep:oxide-fw-search"]

# V2-F13: criterion bench for the nav-graph substrate (observe / top /
# decay / persist), behind the `bench-util` opt-in like every other
# criterion bench in the workspace.
[[bench]]
name = "navgraph"
harness = false
required-features = ["bench-util"]

# F37: criterion bench for the §20 metrics endpoint's render — the bare
# scrape, the cache-plane slot attached (the closure call + the append
# delta), and the attach itself — behind the `bench-util` opt-in like
# every other criterion bench in the workspace.
[[bench]]
name = "metrics"
harness = false
required-features = ["bench-util"]

# V2-E08: criterion bench for the open-in-editor endpoint (the resolver
# chain, the confinement and the full serve shapes), behind the
# `bench-util` opt-in like every other criterion bench in the workspace.
[[bench]]
name = "open_editor"
harness = false
required-features = ["bench-util"]

# V2-F17: criterion bench for the component-cost endpoint (the hit and the
# two refusal shapes the overlay's hover rides), behind the `bench-util`
# opt-in like every other criterion bench in the workspace.
[[bench]]
name = "cost_endpoint"
harness = false
required-features = ["bench-util"]

# V2-F21: criterion bench for the dev-plane trace feed (the steady-state
# ring record at capacity, the full-window snapshot and the endpoint's
# serve render), behind the `bench-util` opt-in like every other
# criterion bench in the workspace.
[[bench]]
name = "trace_feed"
harness = false
required-features = ["bench-util"]

# V2-F22: criterion bench for the trace rows' tracing export (the
# per-record event emit under a live subscriber, the no-subscriber
# no-op, and the dev-boot fanout shape), behind the `bench-util` opt-in
# like every other criterion bench in the workspace.
[[bench]]
name = "trace_export"
harness = false
required-features = ["bench-util"]

# V2-F24: criterion bench for the dev-plane log feed (the steady-state
# ring record at capacity, the capture layer's per-event cost under a
# live subscriber, the full-window snapshot and the endpoint's serve
# render), behind the `bench-util` opt-in like every other criterion
# bench in the workspace.
[[bench]]
name = "log_feed"
harness = false
required-features = ["bench-util"]

[dev-dependencies]
tempfile = { workspace = true }
# V2-F22: the trace-export pins capture the emitted events (the
# `tracing_subscriber::layer::Layer` capture the test file installs as the
# thread-local default) and the bench measures the emit under a live
# subscriber.
tracing-subscriber = { workspace = true }
# V2-F05: the runner/stream pins run under tokio's paused clock
# (`start_paused` + `advance`) so debounce and keepalive cadence are
# deterministic; `test-util` is test-only and never reaches production.
tokio = { workspace = true, features = ["test-util"] }
# V2-B09/V2-F05: criterion for the live-hub and framing benches.
criterion = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "live"
harness = false
required-features = ["bench-util"]

[[bench]]
name = "stream"
harness = false
required-features = ["bench-util"]

# V2-F12: criterion bench for the brownout governor (level transitions and
# the one-atomic-load request-path cost).
[[bench]]
name = "governor"
harness = false
required-features = ["bench-util"]

# V2-A07: criterion bench for the prerender error-status sidecars — the
# serve-start scan (one-time, O(dist)) and the per-request `status_for` probe.
[[bench]]
name = "status_sidecars"
harness = false
required-features = ["bench-util"]

# The search gate bench (R05: the §13.4 query-length cap refusal + the L1
# hit) — needs the endpoint compiled in (the `search` feature) AND the
# criterion harness (`bench-util`).
[[bench]]
name = "search"
harness = false
required-features = ["bench-util", "search"]

# V2-F57: criterion bench for the §11.2 cache plane's mount — the full
# `serve_request` exchange through the mount versus the service's pure core
# alone, plus the unmounted fall-through floor (the F40 None-check cost).
[[bench]]
name = "plane_mount"
harness = false
required-features = ["bench-util"]

# V2-A02: this crate does not inherit the workspace lints yet (the recorded
# dedicated hygiene pass adopts pedantic) — declared so the newer cargo
# `missing_lints_inheritance` notice stays silent about the intent.
[lints]
