[package]
description = "Deploy-target adapters for Oxide: binary, static, Node and Cloudflare, with a capability matrix and a refusal rule."
keywords = ["deployment", "adapters", "serverless", "cloudflare", "web-framework"]
categories = ["web-programming", "development-tools"]
authors.workspace = true
name = "oxide-fw-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
oxide-fw-diagnostics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# V2-R02 config half: exposes the criterion bench harness for the config-key
# refusal seam (the B09 pattern: plain `cargo test` never pays the criterion
# build).
[features]
bench-util = []

# V2-R02 config half: criterion bench for the §18 config-key refusal — the
# `check_config` verdict the build path runs once per deploy (all 12 targets
# with a fully-featured report, the empty report, the single-surface splits).
[[bench]]
name = "config_refusal"
harness = false
required-features = ["bench-util"]
