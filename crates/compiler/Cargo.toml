[package]
description = "Oxc-backed compile passes for Oxide: directives, server-function stubs, React refresh and route guards."
keywords = ["compiler", "oxc", "javascript", "typescript", "jsx"]
categories = ["compilers", "development-tools::build-utils", "web-programming"]
authors.workspace = true
name = "oxide-fw-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
oxide-fw-diagnostics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# V2-F16: spans on the inference seams (the parse-failure fallback path and
# the collect-all reason walk are traceable build-time events).
tracing = { workspace = true }
thiserror = { workspace = true }
# server_fn_id content hashing (§9.4, D6) — workspace-pinned (D6 mandates blake3 everywhere)
blake3 = { workspace = true }
# V2-B07: the parallel-precompile engine's bounded window (the
# `buffer_unordered` stream) — a workspace dep, pinned at the root.
futures = { workspace = true }
# V2-C01: the sub-crates below carry every oxc entry point this crate uses;
# the `oxc` umbrella is NOT listed (cargo's unused-dependencies lint flagged
# it: nothing imports `oxc::`, and pulling the umbrella pinned the full
# feature set into every build that links this crate).
oxc_parser = { workspace = true }
oxc_ast = { workspace = true }
oxc_span = { workspace = true }
oxc_allocator = { workspace = true }
oxc_semantic = { workspace = true }
oxc_transformer = { workspace = true }
oxc_codegen = { workspace = true }
oxc_sourcemap = "9.0.0"

[dev-dependencies]
# V2-C01: criterion harness for the `native` bench (the pick/health cache
# hot path). Opt-in via the bench-util feature so plain `cargo test` never
# pays the criterion build (the V2-B09 pattern).
criterion = { workspace = true }
# V2-B07: the engine pins drive async runtimes (the overlap and
# determinism behaviors are only observable under concurrent tasks).
tokio = { workspace = true }

[features]
# V2-C01: exposes the criterion bench harness for the native-registry
# benches (same shape as `oxide-fw-dispatch`'s bench-util, V2-B09).
bench-util = []

[[bench]]
name = "native"
harness = false
required-features = ["bench-util"]

# V2-B07: the parallel-precompile engine bench, behind the same opt-in.
[[bench]]
name = "precompile_engine"
harness = false
required-features = ["bench-util"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
