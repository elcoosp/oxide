[package]
description = "Oxc-backed compile passes for Oxide: directives, server-function stubs, React refresh and route guards."
keywords = ["compiler", "oxc", "javascript", "typescript", "jsx"]
categories = ["compilers", "development-tools::build-utils", "web-programming"]
authors.workspace = true
name = "oxide-fw-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oxide-fw-diagnostics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# V2-F16: spans on the inference seams (the parse-failure fallback path and
# the collect-all reason walk are traceable build-time events).
tracing = { workspace = true }
thiserror = { workspace = true }
# server_fn_id content hashing (§9.4, D6) — workspace-pinned (D6 mandates blake3 everywhere)
blake3 = { workspace = true }
# V2-B07: the parallel-precompile engine's bounded window (the
# `buffer_unordered` stream) — a workspace dep, pinned at the root.
futures = { workspace = true }
# V2-C01: the sub-crates below carry every oxc entry point this crate uses;
# the `oxc` umbrella is NOT listed (cargo's unused-dependencies lint flagged
# it: nothing imports `oxc::`, and pulling the umbrella pinned the full
# feature set into every build that links this crate).
oxc_parser = { workspace = true }
oxc_ast = { workspace = true }
oxc_span = { workspace = true }
oxc_allocator = { workspace = true }
oxc_semantic = { workspace = true }
oxc_transformer = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_codegen = { workspace = true }
oxc_sourcemap = "9.0.0"
# V2-C03/C04/C05: the native backends' upstreams — optional, each behind
# its own feature (a flag with no backend behind it is dead scaffolding).
verter_core = { workspace = true, optional = true }
# The oxc 0.117 allocator verter_core's entry point is typed against
# (the workspace's own oxc 0.155 stays the transform's stack — the seam
# hands the backend source text and takes emitted text back).
oxc_allocator_0_117 = { package = "oxc_allocator", version = "0.117.0", optional = true }
svelte-compiler = { workspace = true, optional = true }
oxc_react_compiler = { workspace = true, optional = true }
# V2-C05: the oxc 0.143 stack oxc_react_compiler's API is typed against.
# The workspace itself pins oxc 0.155; these are the SAME crates at the
# crate's own pin, package-renamed so one [dependencies] table can carry
# both majors (they unify with the crate's own 0.143 deps). The seam is
# string in / string out — no 0.143 type crosses into the 0.155 world.
oxc_parser_0_143 = { package = "oxc_parser", version = "0.143.0", optional = true }
oxc_allocator_0_143 = { package = "oxc_allocator", version = "0.143.0", optional = true }
oxc_span_0_143 = { package = "oxc_span", version = "0.143.0", optional = true }
oxc_diagnostics_0_143 = { package = "oxc_diagnostics", version = "0.143.0", optional = true }
oxc_semantic_0_143 = { package = "oxc_semantic", version = "0.143.0", optional = true }
oxc_codegen_0_143 = { package = "oxc_codegen", version = "0.143.0", optional = true }
# V2-C02 (the dependency arm): Solid 2.0's official Oxc-based Rust
# compiler core (git-pinned `solidjs/solid@next`, `packages/compiler`).
# Its oxc 0.144 stack stays internal to the crate — the seam hands it
# source text and takes emitted text back, no oxc type crosses.
solidjs-compiler = { workspace = true, optional = true }

[dev-dependencies]
# V2-C01: criterion harness for the `native` bench (the pick/health cache
# hot path). Opt-in via the bench-util feature so plain `cargo test` never
# pays the criterion build (the V2-B09 pattern).
criterion = { workspace = true }
# V2-B07: the engine pins drive async runtimes (the overlap and
# determinism behaviors are only observable under concurrent tasks).
tokio = { workspace = true }
# V2-E03: the migrate pins copy the committed fixture projects into
# fresh tempdirs for the apply half (the fixtures themselves stay
# read-only).
tempfile = { workspace = true }

[features]
# V2-C01: exposes the criterion bench harness for the native-registry
# benches (same shape as `oxide-fw-dispatch`'s bench-util, V2-B09).
bench-util = []
# V2-C03 (§V2-C03): the native Vue SFC compiler (verter_core 0.0.1-beta.1,
# crates.io latest). Off by default — the fast dev build never pays the
# extra stack; the release recipe turns the landed backends on.
native-vue = ["dep:verter_core", "dep:oxc_allocator_0_117"]
# V2-C04 (§V2-C04): the native Svelte compiler (svelte-compiler 0.1.4,
# crates.io latest).
native-svelte = ["dep:svelte-compiler"]
# V2-C05 (§V2-C05): the React Compiler port (oxc_react_compiler 0.143.0).
# The crate rides its own oxc 0.143 stack — the `*143` aliases below are
# the package-renamed pins the seam parses with (string in, string out;
# the workspace's oxc 0.155 transform never shares a type with them).
native-react-compiler = [
    "dep:oxc_react_compiler",
    "dep:oxc_parser_0_143",
    "dep:oxc_semantic_0_143",
    "dep:oxc_codegen_0_143",
    "dep:oxc_allocator_0_143",
    "dep:oxc_span_0_143",
    "dep:oxc_diagnostics_0_143",
]
# V2-C02 (§V2-C02, the dependency arm, 2026-11-15): the native Solid
# compiler. The backend is a thin adapter around Solid 2.0's official
# Oxc-based Rust compiler core — the `solidjs-compiler` crate, git-pinned
# at `solidjs/solid@next` `packages/compiler` (rev 7ea2a02e, the tree
# behind npm `@solidjs/compiler` 2.0.0-rc.21). The earlier kill/re-open
# records (`docs/decisions/C02-solid-*.md`) pinned "no sourceable Cargo
# tree" as the blocker; the `next` branch now publishes the crate, the
# re-run condition the re-open record set, so the in-repo JSX/reactivity
# transform was deleted and the seam wraps upstream. Off by default — the
# fast dev build never pays the extra stack; the release recipe turns the
# landed backends on.
native-solid = ["dep:solidjs-compiler"]

[[bench]]
name = "islands"
harness = false
required-features = ["bench-util"]

[[bench]]
name = "native"
harness = false
required-features = ["bench-util"]

# V2-B07: the parallel-precompile engine bench, behind the same opt-in.
[[bench]]
name = "precompile_engine"
harness = false
required-features = ["bench-util"]

# V2-E03: the migrate planner bench (the discovery walk + the apply
# half), behind the same opt-in.
[[bench]]
name = "migrate"
harness = false
required-features = ["bench-util"]

# V2-F02: the auto-islands inference bench (the per-file scan and the
# project fixpoint), behind the same opt-in.
[[bench]]
name = "interactivity"
harness = false
required-features = ["bench-util"]

# V2-F02: the dev-warn props-surface bench (the per-module usage+import
# scan and the pure-classified cross-reference), behind the same opt-in.
[[bench]]
name = "props_surface"
harness = false
required-features = ["bench-util"]

# V2-C02: the native-Solid walkthrough example. The module it imports
# (`oxide_fw_compiler::solid`) is gated behind `native-solid`, so without
# the explicit target + required-features the auto-discovered example
# broke `cargo check --workspace --all-targets` (E0433 on every default
# feature set — the gate the msrv job and the tier-1 check run).
[[example]]
name = "solid_native"
required-features = ["native-solid"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
