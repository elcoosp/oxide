[package]
description = "The Oxide asset pipeline: CSS bundling, image optimisation, font subsetting, OpenGraph images and content collections."
keywords = ["assets", "css", "images", "fonts", "opengraph"]
categories = ["web-programming", "multimedia::images"]
authors.workspace = true
name = "oxide-fw-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
oxide-fw-diagnostics = { workspace = true }
lightningcss = { workspace = true }
image = { workspace = true }
syntect = { workspace = true }
comrak = { workspace = true }
icu_locale_core = { workspace = true }
formatjs_icu_messageformat = "0.3.0"
read-fonts = { workspace = true }
skrifa = { workspace = true }
subsetter = { workspace = true, optional = true }
ravif = { workspace = true }
usvg = { workspace = true }
tiny-skia = { workspace = true }
resvg = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }
# V2-C09: the image job model — the bounded lanes (tokio), the single-flight
# map (dashmap), the shared outcomes (futures) and the job-span events
# (tracing, the house observability convention).
tokio = { workspace = true }
futures = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# V2-C09: the image_jobs pins drive an async runtime (the lane + single-flight
# behavior is only observable under concurrent tasks).
tokio = { workspace = true }
# V2-C09: criterion harness for the job-model bench, opt-in via bench-util
# (the V2-B09 pattern).
criterion = { workspace = true }

[features]
subset = ["dep:subsetter"]
# V2-C09: exposes the criterion bench harness for the image job model.
bench-util = []

[[bench]]
name = "image_jobs"
harness = false
required-features = ["bench-util"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
