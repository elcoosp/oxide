[package]
description = "The Oxide asset pipeline: CSS bundling, image optimisation, font subsetting, OpenGraph images and content collections."
keywords = ["assets", "css", "images", "fonts", "opengraph"]
categories = ["web-programming", "multimedia::images"]
authors.workspace = true
name = "oxide-fw-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oxide-fw-diagnostics = { workspace = true }
lightningcss = { workspace = true }
image = { workspace = true }
syntect = { workspace = true }
comrak = { workspace = true }
icu_locale_core = { workspace = true }
formatjs_icu_messageformat = "0.3.0"
read-fonts = { workspace = true }
skrifa = { workspace = true }
subsetter = { workspace = true, optional = true }
ravif = { workspace = true }
usvg = { workspace = true }
tiny-skia = { workspace = true }
resvg = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }
# V2-C07: the SVG optimizer seam. `roxmltree` is the well-formedness
# parse-back the preservation rules run on every optimizer output
# (non-optional — the rules hold without the feature); the OXVG backend
# and its AST are opt-in via `svg-oxvg` so the default build stays lean.
roxmltree = { workspace = true }
oxvg_ast = { workspace = true, optional = true }
oxvg_optimiser = { workspace = true, optional = true }
# V2-C09: the image job model — the bounded lanes (tokio), the single-flight
# map (dashmap), the shared outcomes (futures) and the job-span events
# (tracing, the house observability convention).
tokio = { workspace = true }
futures = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }
# V2-C08: the post-prerender glyph harvest (the spec's `text!`-over-body
# walk). Non-optional — the harvest rides every build; only the subsetting
# engine is gated behind `subset` (the roxmltree shape).
lol_html = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# V2-C09: the image_jobs pins drive an async runtime (the lane + single-flight
# behavior is only observable under concurrent tasks).
tokio = { workspace = true }
# V2-C09: criterion harness for the job-model bench, opt-in via bench-util
# (the V2-B09 pattern).
criterion = { workspace = true }

[features]
subset = ["dep:subsetter"]
# V2-C07: the OXVG SVG optimizer backend (the `OxvgSvg` impl and its
# `oxvg_ast`/`oxvg_optimiser` dependency pair). Default off — the seam
# (`SvgOptimizer`, `IdentitySvg`, the rules, the CAS key) compiles
# without it, so a host that never optimizes SVG does not pay for the
# optimizer's tree.
svg-oxvg = ["dep:oxvg_optimiser", "dep:oxvg_ast"]
# V2-C09: exposes the criterion bench harness for the image job model.
bench-util = []

[[bench]]
name = "image_jobs"
harness = false
required-features = ["bench-util"]

[[bench]]
name = "svg_optimizer"
harness = false
required-features = ["bench-util"]

# V2-C08: the glyph-usage seam bench, behind the same bench-util opt-in.
[[bench]]
name = "font_subsetter"
harness = false
required-features = ["bench-util"]

[[example]]
name = "svg_optimizer"
required-features = ["svg-oxvg"]

# V2-C08: the glyph-usage walkthrough drives the real subsetting engine.
[[example]]
name = "font_subsetter"
required-features = ["subset"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
