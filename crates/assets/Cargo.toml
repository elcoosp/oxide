[package]
description = "The Oxide asset pipeline: CSS bundling, image optimisation, font subsetting, OpenGraph images and content collections."
keywords = ["assets", "css", "images", "fonts", "opengraph"]
categories = ["web-programming", "multimedia::images"]
authors.workspace = true
name = "oxide-fw-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oxide-fw-diagnostics = { workspace = true }
lightningcss = { workspace = true }
image = { workspace = true }
syntect = { workspace = true }
comrak = { workspace = true }
icu_locale_core = { workspace = true }
formatjs_icu_messageformat = "0.3.0"
read-fonts = { workspace = true }
skrifa = { workspace = true }
subsetter = { workspace = true, optional = true }
# M1 (capability matrix): the AVIF encoder rides the non-default `avif`
# feature. ravif pulls the rav1e assembly chain (nasm), so the default
# `--all-targets` build compiles with no external assembler; the encoder
# stays fully wired under `--features avif`, and an AVIF request without
# the feature is refused loudly (`AST-AVIF`) with the documented WebP/PNG
# fallback (images.rs, the same shape as the WebP arm).
ravif = { workspace = true, optional = true }
usvg = { workspace = true }
tiny-skia = { workspace = true }
resvg = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }
# V2-C07: the SVG optimizer seam. `roxmltree` is the well-formedness
# parse-back the preservation rules run on every optimizer output
# (non-optional — the rules hold without the feature); the OXVG backend
# and its AST are opt-in via `svg-oxvg` so the default build stays lean.
roxmltree = { workspace = true }
oxvg_ast = { workspace = true, optional = true }
oxvg_optimiser = { workspace = true, optional = true }
# V2-C09: the image job model — the bounded lanes (tokio), the single-flight
# map (dashmap), the shared outcomes (futures) and the job-span events
# (tracing, the house observability convention).
tokio = { workspace = true }
futures = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }
# V2-C08: the post-prerender glyph harvest (the spec's `text!`-over-body
# walk). Non-optional — the harvest rides every build; only the subsetting
# engine is gated behind `subset` (the roxmltree shape).
lol_html = { workspace = true }

[dev-dependencies]
# V2-C10 MDX spike probe (the ONLY consumer — see
# crates/assets/tests/mdx_native_spike.rs and docs/decisions/C10-mdx-kill.md).
snapfire_fsr_mdx = { workspace = true }
tempfile = { workspace = true }
# V2-C09: the image_jobs pins drive an async runtime (the lane + single-flight
# behavior is only observable under concurrent tasks).
tokio = { workspace = true }
# V2-C09: criterion harness for the job-model bench, opt-in via bench-util
# (the V2-B09 pattern).
criterion = { workspace = true }

[features]
subset = ["dep:subsetter"]
# M1: the ravif/rav1e AVIF encoder. Default off — a host that never
# encodes AVIF does not pay the nasm/rav1e build; `--features avif`
# restores the exact pre-gate behavior (real ravif output, `AST-AVIF`
# diagnostics on encoder failure).
avif = ["dep:ravif"]
# V2-C07: the OXVG SVG optimizer backend (the `OxvgSvg` impl and its
# `oxvg_ast`/`oxvg_optimiser` dependency pair). Default off — the seam
# (`SvgOptimizer`, `IdentitySvg`, the rules, the CAS key) compiles
# without it, so a host that never optimizes SVG does not pay for the
# optimizer's tree.
svg-oxvg = ["dep:oxvg_optimiser", "dep:oxvg_ast"]
# V2-C09: exposes the criterion bench harness for the image job model.
bench-util = []

[[bench]]
name = "image_jobs"
harness = false
required-features = ["bench-util"]

[[bench]]
name = "svg_optimizer"
harness = false
required-features = ["bench-util"]

# V2-C08: the glyph-usage seam bench, behind the same bench-util opt-in.
[[bench]]
name = "font_subsetter"
harness = false
required-features = ["bench-util"]

[[example]]
name = "svg_optimizer"
required-features = ["svg-oxvg"]

# V2-C08: the glyph-usage walkthrough drives the real subsetting engine.
[[example]]
name = "font_subsetter"
required-features = ["subset"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# V2-A02: M1.f — this crate now inherits the workspace lints (the recorded
# dedicated hygiene pass adopts pedantic). The workspace clippy gate
# (`-D warnings`) promotes the pedantic groups to hard failures, held with
# zero `#[allow]` escape hatches.
[lints]
workspace = true
