[package]
description = "The Oxide rendering pipeline that turns route data and a page module into an HTML stream."
keywords = ["ssr", "server-rendering", "streaming", "html", "web-framework"]
categories = ["web-programming", "template-engine"]
authors.workspace = true
name = "oxide-fw-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oxide-fw-diagnostics = { workspace = true }
oxide-fw-odf = { workspace = true }
lol_html = { workspace = true }
bytes = { workspace = true }
# V2-B08 phase 2: the chunk-safe `NonceSplicer` (spec-verbatim) finds the
# nonce across chunk boundaries with `memchr::memmem`.
memchr = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
insta = { workspace = true }
criterion = { workspace = true }
# The `interaction_replay` example reads the typed config flag (no cycle —
# config does not depend on render).
oxide-fw-config = { workspace = true }

[features]
# V2-B09: exposes the criterion bench harness (`bootstrap` group). Plain
# `cargo test` never pays the criterion build — the bench target is gated
# by `required-features` like the A02/A05/A06/F04 benches.
bench-util = []

# V2-F03: criterion bench for the hydration-bootstrap emitters (the
# pre-F03 shapes vs the replay-advertising one).
[[bench]]
name = "bootstrap"
harness = false
required-features = ["bench-util"]

# V2-B08 phase 2: criterion bench for the streaming `NonceSplicer` —
# 20 KB / 200 KB / 2 MB bodies spliced in 64 KB chunks against the
# whole-document `str::replace` the CLI still runs.
[[bench]]
name = "splice"
harness = false
required-features = ["bench-util"]

# V2-F03: the milestone's crates opt into the workspace lint policy
# (`[workspace.lints.rust] warnings = "deny"` + `[workspace.lints.clippy]
# pedantic`) — the documented adoption path; the command-line gate
# (`clippy -- -D warnings`) then holds these crates to pedantic with no
# `#[allow]` escape hatch in their sources.
[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
