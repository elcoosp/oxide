[package]
description = "The Oxide WebAssembly plugin host: component-model loading, host functions and the transform ABI."
keywords = ["wasm", "plugins", "wasmtime", "component-model", "extensibility"]
categories = ["wasm", "development-tools::build-utils"]
authors.workspace = true
name = "oxide-fw-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
oxide-fw-diagnostics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
wit-parser = { workspace = true }
wasmtime-wasi = { workspace = true }
wasmtime = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
