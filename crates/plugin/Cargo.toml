[package]
description = "The Oxide WebAssembly plugin host: component-model loading, host functions and the transform ABI."
keywords = ["wasm", "plugins", "wasmtime", "component-model", "extensibility"]
categories = ["wasm", "development-tools::build-utils"]
authors.workspace = true
name = "oxide-fw-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oxide-fw-diagnostics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
wasmtime = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
criterion = { workspace = true }

# The plugin-compat matrix benches (the adapters `doc_table` pattern: plain
# `cargo test` never pays the criterion build).
[features]
bench-util = []

[[bench]]
name = "compat"
harness = false
required-features = ["bench-util"]

# V2-A02: this crate does not inherit the workspace lints yet (the recorded
# dedicated hygiene pass adopts pedantic) — declared so the newer cargo
# `missing_lints_inheritance` notice stays silent about the intent.
[lints]
