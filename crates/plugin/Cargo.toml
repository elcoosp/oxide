[package]
description = "The Oxide WebAssembly plugin host: component-model loading, host functions and the transform ABI."
keywords = ["wasm", "plugins", "wasmtime", "component-model", "extensibility"]
categories = ["wasm", "development-tools::build-utils"]
authors.workspace = true
name = "oxide-fw-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oxide-fw-diagnostics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
wasmtime = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
criterion = { workspace = true }

# The plugin-compat matrix benches (the adapters `doc_table` pattern: plain
# `cargo test` never pays the criterion build).
[features]
bench-util = []

[[bench]]
name = "compat"
harness = false
required-features = ["bench-util"]

# V2-A02 closing leg (M1): this crate now inherits the workspace lint policy
# (`[workspace.lints.rust] warnings = "deny"` + `[workspace.lints.clippy]
# pedantic = warn, priority = -1`). The pedantic debt is cleared (2
# `assert_is_empty` findings in `tests/compat_tdd.rs` fixed via
# `assert_eq!(.., [] as [_; 0])`); the command-line gate
# (`clippy -- -D warnings -W clippy::pedantic`) holds this crate to pedantic
# with no `#[allow]` escape hatch. The drift guard
# (`crates/diagnostics/tests/lint_uniformity.rs` + `scripts/check-lint-uniformity.sh`)
# fails if this table re-diverges.
[lints]
workspace = true
