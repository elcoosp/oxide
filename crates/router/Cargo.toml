[package]
description = "File-system routing for Oxide: route tree scanning, pattern matching and type generation."
keywords = ["router", "file-based-routing", "ssr", "typegen", "web-framework"]
categories = ["web-programming::http-server", "web-programming"]
authors.workspace = true
name = "oxide-fw-router"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oxide-fw-diagnostics = { workspace = true }
rkyv = { workspace = true }
memmap2 = { workspace = true }
# V2-E09: `regex` is optional behind the `regex`/`scan` features so the
# wasm32 edge build (`oxide-fw-core-wasm` with `default-features = false`)
# can omit it — the matcher's `:name{regex}` constraint path falls back to
# a superset match, and the route-file scanner (the only other regex user)
# is gated behind `scan` (build-time only). Keeps the wasm under the
# 400 KB gzip budget without pulling aho-corasick/regex-automata.
regex = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
# V2-B02: stack-allocated segment buffers + captures (allocation-free matcher).
smallvec = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
# V2-B09: benchmark harness + heap-allocation budget tests.
criterion = { workspace = true }
dhat = { workspace = true }

# V2-B09: criterion harness (bench targets are opt-in via the bench-util
# feature so plain `cargo test` never pays the criterion build).
[[bench]]
name = "match"
harness = false
required-features = ["bench-util"]

[[bench]]
name = "typegen_search"
harness = false
required-features = ["bench-util"]

[features]
# V2-E09: `scan` (the route-file scanner + its regex) and `regex` (the
# matcher's `:name{regex}` constraint path) are default-on so native builds
# are unchanged; the wasm32 edge build passes `default-features = false` to
# omit both (the edge consumes `routes.json`, never scans files, and a
# constrained param matches as a superset — recorded in docs/deviations.md).
default = ["scan", "regex"]
# V2-B09: exposes the synthetic route generator (`testing::synthetic_entries`)
# to benches and allocation-budget test targets.
bench-util = []
# The route-file scanner (build-time only; pulls regex for constraint
# validation and render/mode/tag scraping).
scan = ["dep:regex"]
# The matcher's `:name{regex}` param-constraint path (full-match semantics).
regex = ["dep:regex"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# V2-A06: adopt the workspace lint policy (pedantic clippy) — the crate is
# held to the same gate as `oxide-fw-dispatch` (V2-A02).
[lints]
workspace = true
