[package]
description = "File-system routing for Oxide: route tree scanning, pattern matching and type generation."
keywords = ["router", "file-based-routing", "ssr", "typegen", "web-framework"]
categories = ["web-programming::http-server", "web-programming"]
authors.workspace = true
name = "oxide-fw-router"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
oxide-fw-diagnostics = { workspace = true }
rkyv = { workspace = true }
memmap2 = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
# V2-B02: stack-allocated segment buffers + captures (allocation-free matcher).
smallvec = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
# V2-B09: benchmark harness + heap-allocation budget tests.
criterion = { workspace = true }
dhat = { workspace = true }

# V2-B09: criterion harness (bench targets are opt-in via the bench-util
# feature so plain `cargo test` never pays the criterion build).
[[bench]]
name = "match"
harness = false
required-features = ["bench-util"]

[[bench]]
name = "typegen_search"
harness = false
required-features = ["bench-util"]

[features]
default = []
# V2-B09: exposes the synthetic route generator (`testing::synthetic_entries`)
# to benches and allocation-budget test targets.
bench-util = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# V2-A06: adopt the workspace lint policy (pedantic clippy) — the crate is
# held to the same gate as `oxide-fw-dispatch` (V2-A02).
[lints]
workspace = true
