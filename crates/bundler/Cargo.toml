[package]
description = "Rolldown integration for Oxide: client and server environments, manifests and chunking."
keywords = ["bundler", "rolldown", "javascript", "code-splitting", "web-framework"]
categories = ["development-tools::build-utils", "web-programming"]
authors.workspace = true
name = "oxide-fw-bundler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tracing = { workspace = true }
oxide-fw-diagnostics = { workspace = true }
oxide-fw-graph = { workspace = true }
oxide-fw-compiler = { workspace = true }
# V2-F14 (the PWA worker emitter): the emitter plans over the typed
# `sw:`/`offline:` keys the config crate owns — the CLI forwards the
# loaded config, the plan speaks the config types, no second surface is
# invented.
oxide-fw-config = { workspace = true }
# V2-C06: the composed plugin maps ride `HookTransformOutput.map` as
# oxc_sourcemap maps — the same crate and 9.0.0 pin the compiler's
# `TransformOutput` already carries, so no second sourcemap implementation
# enters the graph.
oxc_sourcemap = "9.0.0"
oxc_resolver = { workspace = true }
# V2-F17 (the cost engine): the spec's gzip estimation method — the RFC
# 1952 stream length over each module's source — is a REAL stream, not a
# ratio guess; flate2 is the workspace's own gzip crate (§12.1).
flate2 = { workspace = true }
rolldown = { workspace = true }
rolldown_common = { workspace = true }
rolldown_utils = { workspace = true }
rolldown_plugin = { workspace = true }
blake3 = { workspace = true }
arcstr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# V2-E04 (SRI): the sha384 subresource-integrity digests the client manifest
# records (sha2) and their standard-base64 encoding (base64). Both are
# workspace-pinned; sha2 is already the server's `patch base id` hash (D30).
sha2 = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# V2-E04: the SRI benches (behind the `bench-util` opt-in — plain `cargo
# test` never pays the criterion build, the A02/B09/F18/E11 pattern).
criterion = { workspace = true }

[features]
# V2-E04: exposes the criterion bench harness for the SRI digest pass.
bench-util = []

# V2-E04: the sha384 digests ride every client build, so the bench
# questions are (a) the per-chunk digest cost (`sri_digest` over chunk- and
# asset-sized bodies — bytes already in hand) and (b) the rolldown path's
# read-back cost (`integrity_map` over an emitted-file set).
[[bench]]
name = "sri"
harness = false
required-features = ["bench-util"]

# V2-E04 tail: the head producer runs once per prerendered route and the
# integrity verifier once per `oxide verify` — both must stay noise next
# to the render and the verify flow they serve.
[[bench]]
name = "head"
harness = false
required-features = ["bench-util"]

[[bench]]
name = "integrity"
harness = false
required-features = ["bench-util"]

# V2-C06: the composition rides every plugin transform on the build path —
# the pure fold (`compose`) and the JS-plugin wire round trip
# (`compose_v3_json`) must stay noise next to the bundling itself.
[[bench]]
name = "sourcemap_compose"
harness = false
required-features = ["bench-util"]

# V2-F14: the PWA emitter runs once per build — the plan fold over the
# manifest's route/asset maps and the source render must stay noise next
# to the bundling itself.
[[bench]]
name = "pwa"
harness = false
required-features = ["bench-util"]

# V2-F17: the build-side cost engine runs once per build — the per-module
# fold (bytes + the real gzip stream + the chunk lookup) must stay noise
# next to the bundling itself.
[[bench]]
name = "cost"
harness = false
required-features = ["bench-util"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# V2-A02 finish: this crate now inherits the workspace lint policy
# (`[workspace.lints]` rust warnings=deny, clippy pedantic=warn) — the
# dedicated hygiene pass + `cargo clippy --fix` cleared every pedantic
# finding in this crate's own sources, so the bare-table opt-out is retired.
[lints]
workspace = true
