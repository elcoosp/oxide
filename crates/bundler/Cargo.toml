[package]
description = "Rolldown integration for Oxide: client and server environments, manifests and chunking."
keywords = ["bundler", "rolldown", "javascript", "code-splitting", "web-framework"]
categories = ["development-tools::build-utils", "web-programming"]
authors.workspace = true
name = "oxide-fw-bundler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
tracing = { workspace = true }
oxide-fw-diagnostics = { workspace = true }
oxide-fw-graph = { workspace = true }
oxide-fw-compiler = { workspace = true }
oxc_resolver = { workspace = true }
rolldown = { workspace = true }
rolldown_common = { workspace = true }
rolldown_plugin = { workspace = true }
blake3 = { workspace = true }
arcstr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# V2-E04 (SRI): the sha384 subresource-integrity digests the client manifest
# records (sha2) and their standard-base64 encoding (base64). Both are
# workspace-pinned; sha2 is already the server's `patch base id` hash (D30).
sha2 = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# V2-E04: the SRI benches (behind the `bench-util` opt-in — plain `cargo
# test` never pays the criterion build, the A02/B09/F18/E11 pattern).
criterion = { workspace = true }

[features]
# V2-E04: exposes the criterion bench harness for the SRI digest pass.
bench-util = []

# V2-E04: the sha384 digests ride every client build, so the bench
# questions are (a) the per-chunk digest cost (`sri_digest` over chunk- and
# asset-sized bodies — bytes already in hand) and (b) the rolldown path's
# read-back cost (`integrity_map` over an emitted-file set).
[[bench]]
name = "sri"
harness = false
required-features = ["bench-util"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
