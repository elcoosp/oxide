[package]
name = "oxide-fw-core-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Edge subset: router, odf, head, cache keys (spec 2 D18, 18)"

# B-01: `cdylib` is what makes `cargo build --target wasm32-unknown-unknown`
# emit a `.wasm`; `rlib` keeps the crate usable from `cargo test` and the CLI.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxide-fw-odf = { workspace = true }
oxide-fw-router = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
