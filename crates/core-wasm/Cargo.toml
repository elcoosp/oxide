[package]
description = "The Oxide wasm32 edge bundle: a small Rust core compiled to WebAssembly for edge runtimes."
keywords = ["wasm", "edge-computing", "webassembly", "web-framework", "wasm32"]
categories = ["wasm", "web-programming"]
authors.workspace = true
name = "oxide-fw-core-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# B-01: `cdylib` is what makes `cargo build --target wasm32-unknown-unknown`
# emit a `.wasm`; `rlib` keeps the crate usable from `cargo test` and the CLI.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxide-fw-odf = { workspace = true }
# V2-E09: `default-features = false` omits router's `scan`/`regex` features
# from the wasm32 build (the edge consumes `routes.json`, never scans files,
# and a `:name{regex}` constraint matches as a superset) — keeps the wasm
# under the 400 KB gzip budget. The host workspace build still unifies the
# features on via the CLI/server.
oxide-fw-router = { workspace = true, default-features = false }
oxide-fw-edge-primitives = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
# V2-E09: the criterion bench over the new pure exports (match/rules/patch).
# Host-only — never part of the wasm32 build.
criterion = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "edge_ops"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# V2-A02 / V2-E09: this crate now inherits the workspace lints (the
# dedicated hygiene pass adopted pedantic with the edge-completion exports).
[lints]
workspace = true
