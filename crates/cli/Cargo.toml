[package]
name = "oxide-fw-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "clap entry, commands (spec 19)"
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "oxide"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
reqwest = { workspace = true }
image = { workspace = true }
mimalloc = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
oxide-fw-diagnostics = { workspace = true }
oxide-fw-config = { workspace = true }
oxide-fw-router = { workspace = true }
oxide-fw-graph = { workspace = true }
oxide-fw-compiler = { workspace = true }
oxide-fw-bundler = { workspace = true }
blake3 = { workspace = true }
rayon = { workspace = true }
oxide-fw-jshost = { workspace = true }
oxide-fw-cache = { workspace = true, features = ["redis", "s3"] }
dashmap = { workspace = true }
oxide-fw-render = { workspace = true }
oxide-fw-server = { workspace = true }
tokio-rustls = { workspace = true }
oxide-fw-assets = { workspace = true, features = ["subset"] }
oxide-fw-dev = { workspace = true }
oxide-fw-plugin = { workspace = true }
oxide-fw-adapters = { workspace = true }
oxide-fw-odf = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
rmcp = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
schemars = "1"
serde_json = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry = { workspace = true }

futures = { workspace = true }
ring = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
