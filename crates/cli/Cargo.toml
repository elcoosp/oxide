[package]
description = "The `oxide` command-line interface: build, dev server, static export, route inspection and diagnostics."
keywords = ["cli", "build-tool", "dev-server", "web-framework", "bundler"]
categories = ["command-line-utilities", "development-tools::build-utils", "web-programming"]
authors.workspace = true
name = "oxide-fw-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oxide"
path = "src/main.rs"

[features]
# V2-F18: exposes the criterion bench harness for the perf-bisect engine
# (the B09 pattern: plain `cargo test` never pays the criterion build).
bench-util = []

# V2-F09: the built-in search engine + endpoint. Enables the server's
# `/_oxide/search` arm alongside the build-side emission hook.
search = ["dep:oxide-fw-search", "oxide-fw-server/search"]

# V2-C07: the OXVG SVG optimizer backend, forwarded to the assets crate
# (the `svg.optimize` knob refuses with `AST-SVG-002` without it — the
# refusal names this flag).
svg-oxvg = ["oxide-fw-assets/svg-oxvg"]

[[bench]]
name = "perf_bisect"
harness = false
required-features = ["bench-util"]

# V2-F20: the attestation substrate benches behind the same `bench-util`
# opt-in — plain `cargo test` never pays the criterion build.
[[bench]]
name = "attest"
harness = false
required-features = ["bench-util"]

# V2-E11: the docs-generator benches behind the same `bench-util` opt-in —
# the four reference-page renders `oxide docs generate` (and `--check`)
# perform.
[[bench]]
name = "docs"
harness = false
required-features = ["bench-util"]

[dependencies]
chrono = { workspace = true }
oxc_resolver = { workspace = true }
reqwest = { workspace = true }
image = { workspace = true }
mimalloc = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
oxide-fw-diagnostics = { workspace = true }
oxide-fw-config = { workspace = true }
oxide-fw-router = { workspace = true }
# V2-A02: the V8-free dispatch substrate. Consumed by the phase-3 dispatch
# split (stage extraction from build_dispatch); until that PR lands the
# dependency is declared but unused, which keeps the future integration
# commit manifest-only.
oxide-fw-dispatch = { workspace = true }
oxide-fw-graph = { workspace = true }
oxide-fw-compiler = { workspace = true }
oxide-fw-bundler = { workspace = true }
blake3 = { workspace = true }
rayon = { workspace = true }
oxide-fw-jshost = { workspace = true }
oxide-fw-cache = { workspace = true, features = ["redis", "s3"] }
dashmap = { workspace = true }
oxide-fw-render = { workspace = true }
oxide-fw-server = { workspace = true }
# V2-F09: the built-in search engine — optional so the default dev build
# stays lean (the spec's `search` feature; the release pipeline enables
# it via `--features search`).
oxide-fw-search = { workspace = true, optional = true }
# PERF-L0 (readiness): segment-compressed cache entries (zstd frames, gzip
# members) for the L0 hit path.
zstd = { workspace = true }
flate2 = { workspace = true }
tokio-rustls = { workspace = true }
oxide-fw-assets = { workspace = true, features = ["subset"] }
oxide-fw-dev = { workspace = true }
oxide-fw-plugin = { workspace = true }
oxide-fw-adapters = { workspace = true }
oxide-fw-odf = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
rmcp = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
schemars = "1"
serde_json = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry = { workspace = true }

futures = { workspace = true }
ring = { workspace = true }
# V2-F20: the subject digests and the provenance `dist-digest` are
# SHA-256 — the cross-implementation identity the F06 patch base ids
# already standardized on (the TS verifier hashes the same bytes).
sha2 = { workspace = true }
# V2-F18: the perf-bisect error taxonomy (PERF-* diagnostics).
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# V2-F18: the perf-bisect engine benches (behind `bench-util`).
criterion = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
