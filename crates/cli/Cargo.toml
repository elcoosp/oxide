[package]
description = "The `oxide` command-line interface: build, dev server, static export, route inspection and diagnostics."
keywords = ["cli", "build-tool", "dev-server", "web-framework", "bundler"]
categories = ["command-line-utilities", "development-tools::build-utils", "web-programming"]
authors.workspace = true
name = "oxide-fw-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oxide"
path = "src/main.rs"

[features]
# M1 (capability matrix): the embedded V8 isolate (jshost's deno_core chain,
# libclang at build time) rides the non-default-at-crate-level `v8` feature.
# The DEFAULT build keeps it (the shipped binary matches the pre-gate
# capability set); `cargo build -p oxide-fw-cli --no-default-features`
# links with no libclang and serves `server.backend = "v8"` requests with
# a loud `JS-V8OFF` refusal onto the Node worker pool (the default SSR
# backend, unchanged).
default = ["v8"]
v8 = ["oxide-fw-jshost/v8"]
# V2-F11: the object-store deploy targets (`s3://`, `r2://`) ride the
# adapters crate's `s3` feature — release builds enable it, dev builds
# keep the binary lean (the `search` feature pattern).
deploy-s3 = ["oxide-fw-adapters/s3"]
# V2-F18: exposes the criterion bench harness for the perf-bisect engine
# (the B09 pattern: plain `cargo test` never pays the criterion build).
bench-util = []

# V2-F09: the built-in search engine + endpoint. Enables the server's
# `/_oxide/search` arm alongside the build-side emission hook.
search = ["dep:oxide-fw-search", "oxide-fw-server/search"]

# V2-C07: the OXVG SVG optimizer backend, forwarded to the assets crate
# (the `svg.optimize` knob refuses with `AST-SVG-002` without it — the
# refusal names this flag).
svg-oxvg = ["oxide-fw-assets/svg-oxvg"]
# V2-C02/C03/C04/C05: the native framework compilers, forwarded to the
# compiler crate (§V2-C01: default dev builds keep them off; the release
# recipe turns the landed ones on).
native-solid = ["oxide-fw-compiler/native-solid"]
native-vue = ["oxide-fw-compiler/native-vue"]
native-svelte = ["oxide-fw-compiler/native-svelte"]
native-react-compiler = ["oxide-fw-compiler/native-react-compiler"]

[[bench]]
name = "perf_bisect"
harness = false
required-features = ["bench-util"]

# V2-C11: the tool-resolution bench (the `resolve_tool` cost `oxide
# check`/`oxide doctor` pay per external tool arm), behind the same
# `bench-util` opt-in.
[[bench]]
name = "inspect"
harness = false
required-features = ["bench-util"]

# V2-F20: the attestation substrate benches behind the same `bench-util`
# opt-in — plain `cargo test` never pays the criterion build.
[[bench]]
name = "attest"
harness = false
required-features = ["bench-util"]

# V2-E11: the docs-generator benches behind the same `bench-util` opt-in —
# the four reference-page renders `oxide docs generate` (and `--check`)
# perform.
[[bench]]
name = "docs"
harness = false
required-features = ["bench-util"]

# V2-F42: the hot-key window's bench — the F46 session found the target
# NEVER declared (commit 94df30d6's message names "the hot_key_top bench
# target" but its diff added a `[lints]` table), so the file rode
# undeclared auto-discovery instead of the workspace's
# `harness = false` + `required-features = ["bench-util"]` gate. Declared
# here so the criterion target is gated like every other bench.
[[bench]]
name = "hot_key_top"
harness = false
required-features = ["bench-util"]

# V2-F55: the L0 conditional seam's decision-cost bench (the
# `serve_conditional` arms: the echoed INM, the IMS-only re-check, the
# mismatching full serve), behind the same `bench-util` opt-in.
[[bench]]
name = "l0_conditional"
harness = false
required-features = ["bench-util"]

# V2-E06: the Module API v1 bench — the config-edit path on a fixture
# config and the manifest resolution (`resolve_one` → `to_manifest`).
# Behind the same `bench-util` opt-in (plain `cargo test` never pays the
# criterion build).
[[bench]]
name = "module_api"
harness = false
required-features = ["bench-util"]

# The §V2-F08 finish's cost benches — the live-host consult path, the
# bundle-time `.server.rs` stub arms and the discovery walk. Behind the
# same `bench-util` opt-in.
[[bench]]
name = "native_fns"
harness = false
required-features = ["bench-util"]

# V2-F63 recorded pickup: the boot posture line's cost — the byte-stable
# render over a fixed posture and the bounded probe + render over a live
# plane. Behind the same `bench-util` opt-in.
[[bench]]
name = "plane_boot_line"
harness = false
required-features = ["bench-util"]

# V2-F69 config/CLI half: the boot resolver's compose cost — the
# `shards: [...]` array resolved into the F69 composite at one/four/eight
# planes. Behind the same `bench-util` opt-in.
[[bench]]
name = "sharded_resolver"
harness = false
required-features = ["bench-util"]

# §V2-E05: the WASM `load`/`resolveId` wire's bench — the per-module cost
# a `kind: wasm` plugin adds once the CLI composes the host into the
# bundler's hook pair, behind the same bench-util opt-in.
[[bench]]
name = "wasm_hooks"
harness = false
required-features = ["bench-util"]

# V2-E06: the `module_add` consumer example — a V8-free end-to-end
# walkthrough of the config edit + manifest resolution against the
# fixture app under `tests/fixtures/analytics-app/`.
[[example]]
name = "module_add"

# §V2-E05: the WASM `load`/`resolveId` wire's consumer walkthrough — the
# config entries, the hook pair and the resolve→load flow a build runs,
# V8-free.
[[example]]
name = "wasm_hooks"

# §V2-F10/F12: the brownout early-drop's consumer walkthrough — the
# two-pool boot, the Emergency ladder and the oldest-first drain, V8-free.
[[example]]
name = "brownout_evict"

[dependencies]
chrono = { workspace = true }
oxc_resolver = { workspace = true }
reqwest = { workspace = true }
image = { workspace = true }
mimalloc = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
oxide-fw-diagnostics = { workspace = true }
oxide-fw-config = { workspace = true }
oxide-fw-router = { workspace = true }
# V2-A02: the V8-free dispatch substrate. Consumed today by the replay
# command (`commands/replay.rs` impls `oxide_fw_dispatch::replay::ReplayExecutor`
# over the recorded wire captures).
oxide-fw-dispatch = { workspace = true }
oxide-fw-graph = { workspace = true }
oxide-fw-compiler = { workspace = true }
oxide-fw-bundler = { workspace = true }
oxide-rustfn = { workspace = true }
blake3 = { workspace = true }
rayon = { workspace = true }
# M1: jshost's default features are suppressed here so `--no-default-features`
# compiles the V8-free Node-worker build; the crate's own `v8` feature
# forwards `v8` to jshost (the default feature set keeps the isolate).
oxide-fw-jshost = { workspace = true, default-features = false }
oxide-fw-cache = { workspace = true, features = ["redis", "s3"] }
dashmap = { workspace = true }
oxide-fw-render = { workspace = true }
oxide-fw-server = { workspace = true }
# V2-F09: the built-in search engine — optional so the default dev build
# stays lean (the spec's `search` feature; the release pipeline enables
# it via `--features search`).
oxide-fw-search = { workspace = true, optional = true }
# PERF-L0 (readiness): segment-compressed cache entries (zstd frames, gzip
# members) for the L0 hit path.
zstd = { workspace = true }
flate2 = { workspace = true }
tokio-rustls = { workspace = true }
oxide-fw-assets = { workspace = true, features = ["subset"] }
oxide-fw-dev = { workspace = true }
oxide-fw-plugin = { workspace = true }
oxide-fw-adapters = { workspace = true }
oxide-fw-odf = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
rmcp = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
schemars = "1"
serde_json = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry = { workspace = true }

futures = { workspace = true }
ring = { workspace = true }
# V2-F20: the subject digests and the provenance `dist-digest` are
# SHA-256 — the cross-implementation identity the F06 patch base ids
# already standardized on (the TS verifier hashes the same bytes).
sha2 = { workspace = true }
# V2-F18: the perf-bisect error taxonomy (PERF-* diagnostics).
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The native-finish pins (native_finish_tdd) drive the consult's async
# surface from the sync test body through the current-thread runtime.
tokio = { workspace = true }
# V2-F18: the perf-bisect engine benches (behind `bench-util`).
criterion = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# V2-A02 finish: this crate now inherits the workspace lint policy
# (`[workspace.lints]` rust warnings=deny, clippy pedantic=warn). The
# V8-free half (`--no-default-features`, the Node worker pool SSR path) is
# pedantic-clean (0 own findings); the V8 feature gates the libclang-only
# targets that the CI rust/lint job lints on a V8-capable runner.
[lints]
workspace = true
