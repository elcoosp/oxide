[package]
description = "Node and V8 worker pools that execute user JavaScript and TypeScript outside the Oxide Rust process."
keywords = ["javascript", "v8", "nodejs", "worker-pool", "runtime"]
categories = ["web-programming", "development-tools"]
authors.workspace = true
name = "oxide-fw-jshost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oxide-fw-diagnostics = { workspace = true }
oxide-fw-compiler = { workspace = true }
# V8-only (v8_loader's CSS-modules transform): optional so the
# --no-default-features build carries no unused dependency.
lightningcss = { workspace = true, features = ["bundler", "sourcemap"], optional = true }
# V8-only (v8_loader's bare-specifier resolution): optional per the
# same rule.
oxc_resolver = { workspace = true, optional = true }
oxide-fw-cache = { workspace = true }
tracing = { workspace = true }
oxide-fw-odf = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# M1 (capability matrix): the embedded V8 isolate rides the non-default
# `v8` feature. deno_core pulls the V8/bindgen chain (libclang), so a
# V8-free host builds this crate with no external toolchain; the default
# feature keeps the isolate in every normal build (the shipped default),
# `--no-default-features` drops it, and the Node worker backend is
# unaffected either way (same op protocol, spec §4.2).
deno_core = { workspace = true, optional = true }
ring = { workspace = true }
deno_error = { workspace = true, optional = true }
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[features]
default = ["v8"]
# M1: the embedded V8 isolate (deno_core). Gating it keeps `cargo build -p
# oxide-fw-cli --no-default-features` linking with no libclang; the Node
# worker pool (the default SSR backend) is feature-independent.
v8 = ["dep:deno_core", "dep:deno_error", "dep:lightningcss", "dep:oxc_resolver"]
# §20: opts the trace-parent bench target in, so plain `cargo test` never
# pays the criterion build (the workspace-wide bench-util gate shape).
bench-util = []

[[bench]]
name = "trace"
harness = false
required-features = ["bench-util"]

# V2-F19: the per-route capability permission bench — `host_allowed`
# (the wildcard predicate), `url_host` (the host extraction) and the
# full fetch-path check (`url_host` + `is_net_allowed`). V8-free (the
# predicate and the extractor are pure Rust in `perm.rs`).
[[bench]]
name = "perm"
harness = false
required-features = ["bench-util"]

# M1: the V8-backend test targets ride the `v8` feature — `cargo test -p
# oxide-fw-jshost --no-default-features` compiles zero V8 test binaries,
# and the default/workspace build (which enables `v8`) runs them exactly
# as before.
[[test]]
name = "v8_bundle_tdd"
required-features = ["v8"]

[[test]]
name = "v8_dispatch_tdd"
required-features = ["v8"]

[[test]]
name = "v8_lazy_entry_tdd"
required-features = ["v8"]

[[test]]
name = "v8_module_tdd"
required-features = ["v8"]

[[test]]
name = "v8_prelude_tdd"
required-features = ["v8"]

[[test]]
name = "v8_ts_loader_tdd"
required-features = ["v8"]

# The §20 trace-parent pins reach the V8 fetch op's `propagate_trace_parent`
# (the pure helper) and the ops table.
[[test]]
name = "trace_parent_tdd"
required-features = ["v8"]

# V2-F19: the per-route capability permission enforcement pins — the
# `PermGuard` seed/clear cycle, the route→permission registry, and the
# hostile fixture (a `setTimeout` created outside the request context
# that calls `fetch`; Model 2's closure). The guard + registry pins need
# no V8 runtime; the hostile fixture boots an isolate (`#[ignore]`-gated,
# rides the `jshost-e2e` CI job).
[[test]]
name = "perm_tdd"
required-features = ["v8"]

# The multi-file snapshot build boots deno_core's snapshot machinery.
[[test]]
name = "snapshot_bundle_tdd"
required-features = ["v8"]

# The walkthrough drives `v8_ops` (the ops table + trace-parent helper).
[[example]]
name = "trace_propagation"
required-features = ["v8"]

# V2-F19: the per-route capability permission walkthrough — the route
# declaration, the PermGuard seed/clear cycle, the net/env/fs boundary
# checks, the `*.` wildcard rule and the default posture.
[[example]]
name = "per_route_permissions"
required-features = ["v8"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# V2-A02: this crate does not inherit the workspace lints yet (the recorded
# dedicated hygiene pass adopts pedantic) — declared so the newer cargo
# `missing_lints_inheritance` notice stays silent about the intent.
[lints]
