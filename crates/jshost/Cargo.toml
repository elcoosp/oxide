[package]
description = "Node and V8 worker pools that execute user JavaScript and TypeScript outside the Oxide Rust process."
keywords = ["javascript", "v8", "nodejs", "worker-pool", "runtime"]
categories = ["web-programming", "development-tools"]
authors.workspace = true
name = "oxide-fw-jshost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oxide-fw-diagnostics = { workspace = true }
oxide-fw-compiler = { workspace = true }
lightningcss = { workspace = true, features = ["bundler", "sourcemap"] }
oxc_resolver = { workspace = true }
oxide-fw-cache = { workspace = true }
tracing = { workspace = true }
oxide-fw-odf = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
deno_core = { workspace = true }
ring = { workspace = true }
deno_error = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[features]
default = []
# §20: opts the trace-parent bench target in, so plain `cargo test` never
# pays the criterion build (the workspace-wide bench-util gate shape).
bench-util = []

[[bench]]
name = "trace"
harness = false
required-features = ["bench-util"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# V2-A02: this crate does not inherit the workspace lints yet (the recorded
# dedicated hygiene pass adopts pedantic) — declared so the newer cargo
# `missing_lints_inheritance` notice stays silent about the intent.
[lints]
