name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]  # §22 platform matrix
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check
      - run: cargo test --workspace
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - name: TS package tests (zero-dep, Node type stripping)
        run: |
          set -e
          for d in packages/oxide packages/react packages/vue packages/svelte packages/solid packages/create-oxide; do
            pnpm -C "$d" test
          done

  plugin-fixtures:
    name: plugin fixture gate (§15-F)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the CLI
        run: cargo build -p oxide-cli
      - name: Plugin fixture gate
        run: ./tests/fixtures/plugins/check.sh

  conformance:
    name: conformance gate (D20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - name: Conformance suite (all four adapters)
        run: pnpm -C conformance test

  fixtures-v8:
    name: V8 backend fixture gate (PH0-03)
    runs-on: macos-latest   # V8 host is built/tested on macOS here; ubuntu if
                            # the toolchain supports it — see WORKLOG.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - run: pnpm install --frozen-lockfile
      - name: Build the CLI
        run: cargo build -p oxide-cli
      - name: V8 backend fixture gate
        run: ./tests/fixtures/check-v8.sh

  bench-gate:
    name: bench regression gate (>5% fails, §21)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - run: pnpm install --frozen-lockfile
      - name: Build the CLI
        run: cargo build -p oxide-cli
      - name: Run the benchmark table
        run: ./benchmarks/run.sh | tee /tmp/bench.txt
      - name: Compare to report.md (>5% regression fails)
        run: ./benchmarks/gate.sh /tmp/bench.txt benchmarks/report.md

  redis:
    name: Redis L2 wire tests (§11.2)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the #[ignore]d redis integration test
        env:
          OXIDE_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          cargo test -p oxide-cache --features redis -- --include-ignored

  fuzz-decode:
    name: ODF decoder fuzz (§22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Property-based fuzz (1000 random inputs per case)
        run: cargo test -p oxide-odf --test fuzz_decode --release

  stale-strings:
    name: doc-rot grep gate (§23)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stale-string grep
        run: ./scripts/check-stale-strings.sh

  hmr-latency:
    name: HMR latency harness (§13.3 / §21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI
        run: cargo build -p oxide-cli
      - name: Build smoke-app-react
        run: ./target/debug/oxide-cli build --root examples/smoke-app-react
      - name: Run HMR harness (fails if no edit reaches 200-with-marker)
        run: ./benchmarks/hmr.sh

  jshost-e2e:
    name: loader/framework worker e2e (§9.3 / §10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - name: Install workspace deps (for the worker's tsx loader)
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Run the ignored loader_host / framework_host e2e tests
        # Both are real e2e runs (spawn a Node worker, exercise the wire).
        # No `|| true` on either: if the framework host tests regress, the
        # job is red. The previous version swallowed framework_host_e2e
        # failures — the sibling loader_host_e2e did not, so the two halves
        # of the same subsystem reported different verdicts for the same
        # class of bug.
        run: |
          cargo test -p oxide-jshost --test loader_host_e2e -- --ignored --test-threads=1
          cargo test -p oxide-jshost --test framework_host_e2e -- --ignored --test-threads=1

  playwright:
    name: Playwright e2e (§22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - name: Build CLI
        run: cargo build -p oxide-cli
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Install Playwright browsers
        working-directory: tests/playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: tests/playwright
        run: pnpm exec playwright test --timeout=25000
