name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]  # §22 platform matrix
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check
      - run: cargo test --workspace
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - name: TS package tests (zero-dep, Node type stripping)
        run: |
          set -e
          for d in packages/oxide packages/react packages/vue packages/svelte packages/solid packages/create-oxide; do
            pnpm -C "$d" test
          done

  plugin-fixtures:
    name: plugin fixture gate (§15-F)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the CLI
        run: cargo build -p oxide-cli
      - name: Plugin fixture gate
        run: ./tests/fixtures/plugins/check.sh

  conformance:
    name: conformance gate (D20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - name: Conformance suite (all four adapters)
        run: pnpm -C conformance test

  fixtures-v8:
    name: V8 backend fixture gate (PH0-03)
    runs-on: macos-latest   # V8 host is built/tested on macOS here; ubuntu if
                            # the toolchain supports it — see WORKLOG.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - run: pnpm install --frozen-lockfile
      - name: Build the CLI
        run: cargo build -p oxide-cli
      - name: V8 backend fixture gate
        run: ./tests/fixtures/check-v8.sh

  bench-gate:
    name: bench regression gate (>5% fails, §21)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - run: pnpm install --frozen-lockfile
      - name: Build the CLI
        run: cargo build -p oxide-cli
      - name: Run the benchmark table
        run: ./benchmarks/run.sh | tee /tmp/bench.txt
      - name: Compare to report.md (>5% regression fails)
        run: ./benchmarks/gate.sh /tmp/bench.txt benchmarks/report.md
