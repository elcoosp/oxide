# The Oxide error-code registry (Appendix V2.K).
#
# One table per stable diagnostic code: `message` is the human meaning,
# `fix` the documented remedy when one exists, and `spec_only = true`
# marks codes the spec defines for work packages that have not landed
# yet (the coverage test only enforces the landed codes).
#
# Gates: docs/reference/errors.md renders this file (ErrorsPage), and
# crates/cli/tests/errors_registry_tdd.rs fails when a production call
# site raises a code this file does not carry.

[ADP-CAP]
message = "target `{}` does not support `{feature}`; remove the requirement or pick another target (§18 refusal rule)"

[ADP-IO]
message = "cannot create {}: {e}"

[ADP-JSON]
message = "serialize {name}: {e}"

[ADP-STATIC-DYN]
message = "route `{route}` is `dynamic` and has no prerendered output; static export requires prerendering or `static.fallback` (§10.5)"
fix = "Prerender the route or set `static.fallback`"

