[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/config",
    "crates/graph",
    "crates/compiler",
    "crates/bundler",
    "crates/jshost",
    "crates/router",
    "crates/dispatch",
    "crates/server",
    "crates/render",
    "crates/cache",
    "crates/odf",
    "crates/search",
    "crates/assets",
    "crates/dev",
    "crates/plugin",
    "crates/adapters",
    "crates/core-wasm",
    "crates/diagnostics",
    "crates/schema",
    "crates/macros",
    "crates/rustfn",
]

[workspace.package]
version = "0.17.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elcoosp/oxide"
authors = ["elcoosp <elcoosp@gmail.com>"]

# V2-A02: workspace lint policy. Crates opt in per-manifest with
# `[lints] workspace = true`; `oxide-fw-dispatch` opted in first, then
# `oxide-fw-router` and `oxide-fw-schema` (V2-A06). The remaining V8-free
# crates adopt pedantic in a dedicated hygiene pass; the V8 crates cannot
# be linted without a V8-capable host. Command-line gates (CI
# `clippy -- -D warnings`) promote the warn-level groups to hard failures,
# so a crate that opts in is held to pedantic without any `#[allow]`
# escape hatch in its sources.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
# Priority -1 so crate-local clippy attributes can still override individual
# lints if a documented exception is ever needed (none exist today).
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
# V2-C03 (§V2-C03 spike): the native Vue SFC compiler — crates.io latest
# (0.0.1-beta.1, 2026-03-16; the upstream artifact of the verter project).
# Pins its own oxc 0.117 stack; the NativeCompiler seam is string-in /
# string-out, so the skew never shares a type boundary (§0b(3) is about
# shared public types — there are none across this seam).
verter_core = "0.0.1-beta.1"
# The published 0.0.1-beta line is internally skewed: verter_core
# beta.1 compiles against oxc_span 0.117 while its sibling
# `verter_span ^0.0.1-beta.1` resolves to beta.6 (built against oxc_span
# 0.151) — 101 type-mismatch errors in the published pair. Pinning the
# sibling to the matching beta.1 unifies the oxc_span versions. The
# pin lives in Cargo.lock (cargo update -p verter_span --precise
# 0.0.1-beta.1) — a workspace [dependencies] entry cannot override a
# transitive requirement.
# V2-C04 (§V2-C04 spike): the native Svelte compiler — crates.io latest
# (0.1.4, 2026-03-16). Same string-boundary rule: it pins oxc 0.118.
svelte-compiler = "0.1.4"
# V2-C05 (§V2-C05 spike): the React Compiler port — crates.io latest
# (0.143.0, 2026-08-03; fresh). It pins the oxc 0.143 stack while the
# workspace transforms ride oxc 0.155; the seam hands it source text and
# takes emitted text back (parse with its own parser, compile, print).
oxc_react_compiler = "0.143.0"
# V2-C10 (§V2-C10 MDX spike): the probe's dev-dependency — the decision is
# adapter neutrality, and the spike test is the only consumer. If the
# decision is `keep`, the runtime dep lands in the assets crate behind its
# own feature; if `kill`, this line is the one thing left so the next
# agent can re-run `crates/assets/tests/mdx_native_spike.rs` after a dep
# bump. (snapfire_fsr_mdx 0.2.3, 2026-11-09 — fresh; pins oxc 0.155,
# matching the workspace.)
snapfire_fsr_mdx = "0.2.3"
# V2-C02 (the C02 dependency arm, 2026-11-15): Solid 2.0's official
# Oxc-based Rust compiler core — the Rust crate behind npm's
# `@solidjs/compiler` 2.0.0-rc.21, now published in the `solidjs/solid`
# `next` tree at `packages/compiler`. Pinned to the full SHA the branch
# resolved at (a Cargo git dependency takes `rev` OR `branch`, not both —
# the rev IS the branch pin). `default-features = false` drops the `node`
# NAPI feature (no Node host in the Rust build) and the `tsrx` feature
# (which would drag a second, git-pinned oxc 0.140 fork). It pins its own
# oxc 0.144 stack while the workspace transforms ride oxc 0.155; the seam
# is string in / string out, so no oxc type crosses (the C01 seam rule —
# the same shape as verter_core's 0.117 and oxc_react_compiler's 0.143
# skews above).
solidjs-compiler = { git = "https://github.com/solidjs/solid", dir = "packages/compiler", rev = "7ea2a02e9edc976e4be4d060c7e65ba85d10b42c", default-features = false }
# Internal crates (spec §23)
oxide-fw-diagnostics = { path = "crates/diagnostics" }
oxide-fw-odf = { path = "crates/odf" }
oxide-fw-router = { path = "crates/router" }
oxide-fw-dispatch = { path = "crates/dispatch" }
oxide-fw-graph = { path = "crates/graph" }
oxide-fw-config = { path = "crates/config" }
oxide-fw-cache = { path = "crates/cache" }
oxide-fw-search = { path = "crates/search" }
oxide-fw-compiler = { path = "crates/compiler" }
oxide-fw-bundler = { path = "crates/bundler" }
oxide-fw-jshost = { path = "crates/jshost", default-features = false }
oxide-fw-plugin = { path = "crates/plugin" }
oxide-fw-render = { path = "crates/render" }
oxide-fw-server = { path = "crates/server" }
oxide-fw-assets = { path = "crates/assets" }
oxide-fw-dev = { path = "crates/dev" }
oxide-fw-adapters = { path = "crates/adapters" }
# V2-F08: the native server functions host (the user-facing facade is
# `oxide-rustfn`; the proc macros ride `oxide-macros`).
oxide-macros = { path = "crates/macros" }
oxide-rustfn = { path = "crates/rustfn" }

# Async / HTTP / TLS (spec Appendix A: stable, direct use)
tokio = { version = "1.52.3", features = ["full"] }
# §11.2 cache.handler=redis / cache.handler=s3 (optional drivers;
# feature-gated in oxide-fw-cache so the default build stays lean)
redis = { version = "1.8.0", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
object_store = { version = "0.14", features = ["aws"] }
# V2-C07: the SVG optimizer backend (feature-gated in oxide-fw-assets as
# `svg-oxvg` — the seam and the preservation rules compile without it;
# `roxmltree` is the well-formedness parse-back the rules run on every
# optimizer output, so it rides every assets build at its tiny size).
roxmltree = "0.21.2"
oxvg_ast = { version = "0.0.9", features = ["parse", "serialize", "roxmltree"] }
oxvg_optimiser = "0.0.9"
hyper = { version = "1.12.0", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1", "http2", "client-legacy"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
memchr = "2.8.3"
futures = "0.3.34"
async-trait = "0.1.92"
ring = "0.17"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
rustls-pemfile = "2.2.0"
# §12.1: HTTP/3 (quinn QUIC + h3 framing). Opt-in at runtime via `server.http3`.
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"

# Serialization / storage (spec Appendix A)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SPEC-19.1 / §19-B: ISO-8601 cache timestamps (oxide audit).
chrono = { version = "0.4", features = ["clock", "serde"] }
# SPEC-19.1 / §19-B: OSV querybatch client (oxide audit).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rkyv = { version = "0.8.18", features = ["unaligned"] }
redb = "4.3.0"
blake3 = "1.8.7"
zstd = "0.14.3"
memmap2 = "0.9.11"
# V2-F06 (D30): the patch base id is the SHA-256 digest truncated to 16 hex
# — the TS client hashes the same bytes with the same algorithm, so the
# server uses `sha2` (not blake3) for cross-implementation identity.
sha2 = "0.10"

# CLI / config
clap = { version = "4.6.7", features = ["derive", "string", "env"] }

# Concurrency
rayon = "1.12.0"
dashmap = "6.2.1"

# B02: stack-allocated URL segment buffers for the allocation-free matcher.
smallvec = "1"

# Testing / benchmarking (V2-B09)
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# V2-B09: heap-allocation budget tests (one dhat profiler per test binary).
dhat = "0.3.3"

# §16.5→V2-F09: the built-in search engine (`crates/search`). The spec
# pins tantivy by name; `mmap` is the serve side's read-only open
# (`Index::open_in_dir` mmaps the segments, no writer exists at runtime)
# and `en` brings the English stemmer the `search.languages` default
# (`["en"]`) indexes with.
tantivy = { version = "0.27.0", default-features = false, features = ["mmap", "stemmer"] }
# Transform / render / watch
regex = "1.13.1"
lol_html = "3.0.1"
notify = "8.2.0"
url = "2.5.0"

# Images / assets
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# Compression (spec §12.1 step 8: zstd preferred, br, gzip)
flate2 = "1.1.10"
brotli = "8.0.4"

# Errors / observability (spec Appendix A: direct use)
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
# V2-F08: the host side of the `*.server.rs` cdylib model (D33) — the
# loader copies the library beside itself and loads the copy, so the
# file cargo wrote is never held open (Windows locks it).
libloading = "0.8"
# V2-F08: the proc macros behind `#[server_fn]` / `TsType` /
# `export_table!` (`crates/macros`).
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
rmcp = { version = "1.8.0", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt", "registry"] }
tracing-opentelemetry = { version = "0.32.1", default-features = false }
opentelemetry-otlp = { version = "0.31.1", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.31.0", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry = { version = "0.31.0", default-features = false, features = ["trace"] }

# Testing
proptest = "1.12.0"
# No `json`/`yaml` features: they pull `serde_json/preserve_order`, which
# silently flips every `serde_json::Value` in the workspace from sorted keys
# to insertion order — a production-visible semantic change caused by a
# test-only dependency. All snapshot assertions here are on strings.
insta = "1.49.0"
tempfile = "3.27.0"
mimalloc = { version = "0.1" }

# Real upstream dependencies backing every documented stub (docs/deviations.md).
# Added so the stub-replacement passes in the following scripts can flip each
# trait's default engine to the spec's exact external choice (spec Appendix A).
deno_core = { version = "0.412.0" }
deno_error = { version = "0.7.1" }
moka = { version = "0.12.16", features = ["future", "sync"] }
oxc_resolver = { version = "11.24.3" }
oxc_allocator = { version = "0.155.0" }
oxc_parser = { version = "0.155.0" }
oxc_ast = { version = "0.155.0" }
oxc_span = { version = "0.155.0" }
oxc_semantic = { version = "0.155.0" }
oxc_transformer = { version = "0.155.0" }
oxc_ast_visit = { version = "0.155.0" }
oxc_codegen = { version = "0.155.0" }
# `experimental` is REQUIRED, not vestigial: the incremental-rebuild engine
# (`IncrementalWorker` in `crates/bundler/src/rolldown_backend.rs`) drives
# rolldown's experimental-gated `incremental_write`/scan-mode API — this is
# the Path A DX rescue (f0b4a2c9). Do not drop the feature without also
# retiring that worker. History, so the next oxc roll re-reads this block:
# rolldown 1.2.15's `experimental` once pulled `rolldown_plugin_lazy_
# compilation`, whose Cargo.toml pinned `oxc_allocator = "=0.156"` while the
# workspace used 0.155 — a version split that failed to compile. The
# ecosystem pin (27f5de09) resolved that split. (An older comment here
# claimed the feature was unused and should be disabled; that was stale —
# grep for `incremental_write` before believing it again.)
rolldown = { version = "1.2.15", features = ["experimental"] }
rolldown_common = { version = "1.2.15" }
rolldown_utils = { version = "1.2.15" }
rolldown_plugin = { version = "1.2.15" }
arcstr = "1"
lightningcss = { version = "1.0.0-alpha.72", features = ["bundler", "sourcemap"] }
ravif = { version = "0.13.0" }
skrifa = { version = "0.48.0" }
# SPEC-16.2: font subsetting.
subsetter = "0.1"
read-fonts = { version = "0.45.0" }
resvg = { version = "0.48.1" }
tiny-skia = { version = "0.12" }
usvg = { version = "0.48.1" }
wasmtime = { version = "48.0.1", default-features = false, features = ["addr2line", "async", "component-model", "coredump", "cranelift", "debug-builtins", "demangle", "gc", "gc-drc", "gc-null", "parallel-compilation", "pooling-allocator", "runtime", "std", "threads", "wat"] }
local-ip-address = "0.5.7"
qrcode = { version = "0.14.1", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
icu_locale_core = "2.3.0"
comrak = "0.42.0"
base64 = { version = "0.23.1" }
subtle = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 0
debug = 1

[profile.test]
# opt-level matches [profile.dev] (0) so `cargo test -p <crate>` reuses the
# dev-profile rlibs of its dependencies. With `opt-level = 1` the test
# profile builds its own rlib set, and the first `cargo test` after a
# `cargo check` recompiles the whole dependency tree — for oxide-fw-assets
# that is ravif, resvg, tiny-skia, skrifa, read-fonts, lightningcss,
# comrak and syntect, minutes of `rustc` with no visible progress on a
# non-TTY. The test binaries are marginally slower at opt-level 0; none
# of the suites here are throughput-bound.
opt-level = 0
# Disable debuginfo in test binaries: the per-test .dSYM bundles on macOS
# routinely run into the multi-GB range and are not needed for `cargo test`.
#
# NOTE: the `strip = "debuginfo"` step was removed because on a disk-constrained
# machine the strip operation itself peaks at ~2× the binary size (it writes a
# temp copy then atomically renames) and the link step then fails with
# "LLVM ERROR: IO failure on output stream: No space left on device". Without
# strip, the binaries are larger on disk but the suite runs. Restore the strip
# line on machines with ample free space, or set CARGO_PROFILE_TEST_STRIP=none
# in the environment instead of touching this file.
debug = false
