[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/config",
    "crates/graph",
    "crates/compiler",
    "crates/bundler",
    "crates/jshost",
    "crates/router",
    "crates/server",
    "crates/render",
    "crates/cache",
    "crates/odf",
    "crates/assets",
    "crates/dev",
    "crates/plugin",
    "crates/adapters",
    "crates/core-wasm",
    "crates/diagnostics",
    "crates/schema",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elcoosp/oxide"
description = "Oxide: framework-agnostic, full-stack meta-framework with a Rust core (working name, spec v0.1)"

[workspace.dependencies]
# Internal crates (spec §23)
oxide-fw-diagnostics = { path = "crates/diagnostics", version = "0.1.0" }
oxide-fw-schema = { path = "crates/schema", version = "0.1.0" }
oxide-fw-odf = { path = "crates/odf", version = "0.1.0" }
oxide-fw-router = { path = "crates/router", version = "0.1.0" }
oxide-fw-graph = { path = "crates/graph", version = "0.1.0" }
oxide-fw-config = { path = "crates/config", version = "0.1.0" }
oxide-fw-cache = { path = "crates/cache", version = "0.1.0" }
oxide-fw-compiler = { path = "crates/compiler", version = "0.1.0" }
oxide-fw-bundler = { path = "crates/bundler", version = "0.1.0" }
oxide-fw-jshost = { path = "crates/jshost", version = "0.1.0" }
oxide-fw-plugin = { path = "crates/plugin", version = "0.1.0" }
oxide-fw-render = { path = "crates/render", version = "0.1.0" }
oxide-fw-server = { path = "crates/server", version = "0.1.0" }
oxide-fw-assets = { path = "crates/assets", version = "0.1.0" }
oxide-fw-dev = { path = "crates/dev", version = "0.1.0" }
oxide-fw-adapters = { path = "crates/adapters", version = "0.1.0" }
oxide-fw-core-wasm = { path = "crates/core-wasm", version = "0.1.0" }

# Async / HTTP / TLS (spec Appendix A: stable, direct use)
tokio = { version = "1.52.3", features = ["full"] }
# §11.2 cache.handler=redis / cache.handler=s3 (optional drivers;
# feature-gated in oxide-fw-cache so the default build stays lean)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
object_store = { version = "0.11", features = ["aws"] }
hyper = { version = "1.12.0", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1", "http2", "client-legacy"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
futures = "0.3.34"
async-trait = "0.1.92"
ring = "0.17"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
rustls-pemfile = "2.2.0"
# §12.1: HTTP/3 (quinn QUIC + h3 framing). Opt-in at runtime via `server.http3`.
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"

# Serialization / storage (spec Appendix A)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SPEC-19.1 / §19-B: ISO-8601 cache timestamps (oxide audit).
chrono = { version = "0.4", features = ["clock", "serde"] }
# SPEC-19.1 / §19-B: OSV querybatch client (oxide audit).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rkyv = { version = "0.8.18", features = ["unaligned"] }
redb = "4.3.0"
blake3 = "1.8.7"
zstd = "0.14.2"
memmap2 = "0.9.11"

# CLI / config
clap = { version = "4.6.7", features = ["derive", "string", "env"] }

# Concurrency
rayon = "1.12.0"
dashmap = "6.2.1"

# Transform / render / watch
regex = "1.13.1"
lol_html = "3.0.1"
notify = "8.2.0"
url = "2.5.0"

# Images / assets
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# Compression (spec §12.1 step 8: zstd preferred, br, gzip)
flate2 = "1.1.10"
brotli = "8.0.4"

# Errors / observability (spec Appendix A: direct use)
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
rmcp = { version = "1.8.0", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt", "registry"] }
tracing-opentelemetry = { version = "0.32.1", default-features = false }
opentelemetry-otlp = { version = "0.31.1", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.31.0", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry = { version = "0.31.0", default-features = false, features = ["trace"] }
miette = { version = "7.6.0", features = ["fancy"] }

# Testing
proptest = "1.12.0"
# No `json`/`yaml` features: they pull `serde_json/preserve_order`, which
# silently flips every `serde_json::Value` in the workspace from sorted keys
# to insertion order — a production-visible semantic change caused by a
# test-only dependency. All snapshot assertions here are on strings.
insta = "1.49.0"
tempfile = "3.27.0"
tokio-test = "0.4.6"
mimalloc = { version = "0.1" }

# Real upstream dependencies backing every documented stub (docs/deviations.md).
# Added so the stub-replacement passes in the following scripts can flip each
# trait's default engine to the spec's exact external choice (spec Appendix A).
deno_core = { version = "0.412.0" }
deno_error = { version = "0.7.1" }
deno_ast = { version = "0.53.3" }
moka = { version = "0.12.16", features = ["future", "sync"] }
oxc = { version = "0.153.0", features = ["full"] }
oxc_resolver = { version = "11.24.3" }
oxc_allocator = { version = "0.153.0" }
oxc_parser = { version = "0.153.0" }
oxc_ast = { version = "0.153.0" }
oxc_span = { version = "0.153.0" }
oxc_semantic = { version = "0.153.0" }
oxc_transformer = { version = "0.153.0" }
oxc_codegen = { version = "0.153.0" }
rolldown = { version = "1.2.13" }
rolldown_common = { version = "1.2.13" }
rolldown_plugin = { version = "1.2.13" }
arcstr = "1"
lightningcss = { version = "1.0.0-alpha.72", features = ["bundler", "sourcemap"] }
ravif = { version = "0.13.0" }
skrifa = { version = "0.48.0" }
# SPEC-16.2: font subsetting.
subsetter = "0.1"
read-fonts = { version = "0.45.0" }
write-fonts = { version = "0.52.0" }
resvg = { version = "0.48.1" }
tiny-skia = { version = "0.12" }
usvg = { version = "0.48.1" }
taffy = { version = "0.14.0" }
parley = { version = "0.11.0" }
wasmtime = { version = "48.0.1", features = ["component-model", "wat"] }
local-ip-address = "0.5.7"
qrcode = { version = "0.14.1", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
icu_locale_core = "2.3.0"
comrak = "0.42.0"
wasmtime-wasi = { version = "48.0.1" }
wit-parser = { version = "0.259.0" }
base64 = { version = "0.23.1" }
subtle = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 0
debug = 1

[profile.test]
# opt-level matches [profile.dev] (0) so `cargo test -p <crate>` reuses the
# dev-profile rlibs of its dependencies. With `opt-level = 1` the test
# profile builds its own rlib set, and the first `cargo test` after a
# `cargo check` recompiles the whole dependency tree — for oxide-fw-assets
# that is ravif, resvg, tiny-skia, skrifa, read-fonts, lightningcss,
# comrak and syntect, minutes of `rustc` with no visible progress on a
# non-TTY. The test binaries are marginally slower at opt-level 0; none
# of the suites here are throughput-bound.
opt-level = 0
# Disable debuginfo in test binaries: the per-test .dSYM bundles on macOS
# routinely run into the multi-GB range and are not needed for `cargo test`.
#
# NOTE: the `strip = "debuginfo"` step was removed because on a disk-constrained
# machine the strip operation itself peaks at ~2× the binary size (it writes a
# temp copy then atomically renames) and the link step then fails with
# "LLVM ERROR: IO failure on output stream: No space left on device". Without
# strip, the binaries are larger on disk but the suite runs. Restore the strip
# line on machines with ample free space, or set CARGO_PROFILE_TEST_STRIP=none
# in the environment instead of touching this file.
debug = false
