# git-cliff configuration for Oxide (https://git-cliff.org)
#
# Tuned for this repo's commit style: conventional commits with a scope,
# e.g. `fix(cli): forward action Set-Cookie headers on 200 re-render (B6)`.
# The scope is preserved in the changelog entry so a reader can tell what
# subsystem a change touched.

[changelog]
header = """
# Changelog\n
All notable changes to Oxide are documented here. Generated from git
history by [git-cliff](https://git-cliff.org); the format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and this project
adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
Oxide is pre-1.0: the API is not yet frozen, and releases before v1.0 may
include breaking changes announced in the relevant section below.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
render_always = true

[git]
# Match conventional-commit prefixes. Longest match first so `feat(scope)`
# isn't shadowed by a generic `feat`.
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactored" },
  { message = "^revert", group = "Reverted" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "CI" },
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  { message = "^chore", group = "Chores" },
  { message = "^style", group = "Style" },
]
# Include bodies in the changelog for feature/fix commits — the body is
# where the "why" lives, and this repo's commits carry it.
filter_commits = false
# Keep the (B0), (B6) etc. markers — they tie entries to the release plan's
# audit doc.
protect_breaking_commits = true
# Merge commits are noise; drop them.
commit_preprocessors = [
  { pattern = '^\\.\\.\\.$', replace = "" },
]
# Tags look like v0.1.0, v0.2.0, ...
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
# Ignore merge commits (GitHub's "Merge pull request #N" and local merges).
topo_order = false
sort_commits = "oldest"
